<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Sticky Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
/* Layout: four views (sticky board, formula sheet, long-form notes, interview Q&A) sharing one day filter and search */
:root{
  --board:#e9ecef; --board-ink:#1d232b; --muted:#5b6672; --line:#cfd5db; --chip:#ffffff; --chip-on:#1d232b; --chip-on-ink:#ffffff;
  --card:#ffffff; --card-soft:#f4f6f8; --accent:#2f6fb0;
  --n-concept:#cfe6ff; --n-pitfall:#ffd0d4; --n-code:#fff1a8; --n-rule:#d4f2cc;
  --d1:#3b82c4; --d2:#c9a227; --d3:#3f9a4a; --dP:#c2456b;
  --lv-basic:#d4f2cc; --lv-mid:#fff1a8; --lv-adv:#ffd0d4;
  --n-ink:#1f2328; --n-soft:#4a525c; --code-bg:rgba(0,0,0,.07); --shadow:0 1px 2px rgba(20,30,40,.12),0 6px 14px rgba(20,30,40,.10);
  --f-note:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#15191e; --board-ink:#e7ebef; --muted:#9aa5b1; --line:#2b323a; --chip:#1f252c; --chip-on:#e7ebef; --chip-on-ink:#15191e;
  --card:#1c2228; --card-soft:#232a31; --accent:#7fb3e6;
  --n-concept:#1e3550; --n-pitfall:#4a2429; --n-code:#463f1a; --n-rule:#21401f;
  --d1:#6aa7dc; --d2:#d9b84a; --d3:#6cc077; --dP:#e07a9a;
  --lv-basic:#21401f; --lv-mid:#463f1a; --lv-adv:#4a2429;
  --n-ink:#eef1f4; --n-soft:#c2cad3; --code-bg:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#15191e; --board-ink:#e7ebef; --muted:#9aa5b1; --line:#2b323a; --chip:#1f252c; --chip-on:#e7ebef; --chip-on-ink:#15191e;
  --card:#1c2228; --card-soft:#232a31; --accent:#7fb3e6;
  --n-concept:#1e3550; --n-pitfall:#4a2429; --n-code:#463f1a; --n-rule:#21401f;
  --d1:#6aa7dc; --d2:#d9b84a; --d3:#6cc077; --dP:#e07a9a;
  --lv-basic:#21401f; --lv-mid:#463f1a; --lv-adv:#4a2429;
  --n-ink:#eef1f4; --n-soft:#c2cad3; --code-bg:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.35); color-scheme:dark}

body{background:var(--board);color:var(--board-ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-family:var(--f-note);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.progress{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress b{color:var(--board-ink);font-weight:500}

/* View tabs */
.views{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.view{font:600 14px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px 9px;cursor:pointer;margin-bottom:-1px}
.view[aria-selected="true"]{color:var(--board-ink);border-bottom-color:var(--board-ink)}
.view:focus-visible{outline:2px solid #2f81c7;outline-offset:-2px}
.view .count{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}

.controls{display:flex;flex-direction:column;gap:10px;padding-block:4px 14px;border-bottom:1px solid var(--line);margin-bottom:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:44px;flex:none}
.chip,.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--board-ink);padding:5px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.btn{border-radius:8px}
.chip:focus-visible,.btn:focus-visible,.got:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid #2f81c7;outline-offset:2px}
.dot{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
#q{font:14px var(--f-body);padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--board-ink);flex:1 1 220px;min-width:0;max-width:340px}
.toggle{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
[hidden]{display:none!important}

/* Sticky board */
.board{columns:250px;column-gap:22px}
.note{break-inside:avoid;margin:0 0 22px;padding:14px 16px 12px;color:var(--n-ink);box-shadow:var(--shadow);border-radius:2px 2px 14px 2px;position:relative;transform:rotate(var(--tilt,0deg));transition:transform .15s ease,opacity .15s ease}
.note:hover{transform:rotate(0deg) translateY(-2px)}
.note.concept{background:var(--n-concept)} .note.pitfall{background:var(--n-pitfall)} .note.code{background:var(--n-code)} .note.rule{background:var(--n-rule)}
.note.done{opacity:.45}
.tag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--n-soft);display:flex;justify-content:space-between;gap:8px}
.note h3{font-family:var(--f-note);font-weight:700;font-size:21px;line-height:1.15;margin:6px 0 6px;text-wrap:balance}
.note p{margin:0 0 8px;font-size:14px}
.note pre{margin:6px 0 8px;padding:8px 10px;background:var(--code-bg);border-radius:4px;overflow-x:auto;font:13px/1.45 var(--f-mono);white-space:pre}
.note table{border-collapse:collapse;font-size:12.5px;width:100%;margin:4px 0 8px}
.note td{padding:3px 4px;border-top:1px solid rgba(127,127,127,.25);vertical-align:top}
.note td:first-child{white-space:nowrap;padding-right:8px}
.got{font:500 12px var(--f-body);background:transparent;border:1px solid rgba(127,127,127,.45);color:var(--n-ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.note.done .got{background:var(--n-ink);color:var(--board);border-color:var(--n-ink)}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* Shared rich-text styles for formulas, lessons and answers */
code{font-family:var(--f-mono);font-size:12.5px;background:var(--code-bg);padding:0 4px;border-radius:3px}
pre code{background:none;padding:0}
.rich pre{margin:8px 0 12px;padding:10px 12px;background:var(--code-bg);border-radius:6px;overflow-x:auto;font:13px/1.5 var(--f-mono);white-space:pre}
.rich p{margin:0 0 10px} .rich ul,.rich ol{margin:0 0 10px;padding-left:22px} .rich li{margin:3px 0}
.rich h4{font-size:15px;margin:16px 0 6px}
.rich table{border-collapse:collapse;font-size:13.5px;margin:6px 0 12px;display:block;overflow-x:auto;max-width:100%}
.rich th,.rich td{padding:5px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.rich th{background:var(--card-soft);font-weight:600}
.rich .tip{background:var(--card-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.rich .warn{background:var(--card-soft);border-left:3px solid var(--dP);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.katex-display{margin:8px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.day-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;font-size:20px}
.day-head:first-child{margin-top:0}
.day-head .bar{width:6px;height:20px;border-radius:3px;align-self:center}
.day-head h2{margin:0;font-size:20px}
.day-head span{color:var(--muted);font-size:13px}

/* Formula sheet */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.fcard{background:var(--card);border-radius:10px;border-top:4px solid var(--dc);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.fcard h3{margin:2px 0 4px;font-size:16px}
.fcard .tex{font-size:17px;background:var(--card-soft);border-radius:8px;padding:6px 10px;margin:8px 0}
.fcard .tex-fallback{font:14px var(--f-mono);white-space:pre-wrap}
.fcard .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 3px}
.fcard .sym{width:100%;border-collapse:collapse;font-size:13.5px}
.fcard .sym td{padding:3px 6px 3px 0;border-top:1px solid var(--line);vertical-align:top}
.fcard .sym td:first-child{white-space:nowrap;width:1%;padding-right:12px}
.fcard .ex{font-size:14px}

/* Lessons and Q&A as expandable cards */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:-10px 0 16px}
details.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);margin:0 0 12px;border-left:4px solid var(--dc)}
details.card>summary{cursor:pointer;padding:13px 16px;list-style:none;display:flex;gap:10px;align-items:baseline;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--muted);flex:none;transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary .q{flex:1;min-width:0}
details.card .body{padding:0 18px 14px 34px;max-width:82ch}
.lvl{font:500 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:var(--n-ink);flex:none}
.lvl.basic{background:var(--lv-basic)} .lvl.mid{background:var(--lv-mid)} .lvl.adv{background:var(--lv-adv)}
.ready{flex:none;font-size:12px;color:var(--muted)}
.qa.is-ready{opacity:.6}
.say{background:var(--card-soft);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.say b:first-child{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.qa-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion: reduce){.note{transform:none;transition:none}.note:hover{transform:none}.flash{animation:none}}
@media (max-width:560px){details.card .body{padding-left:16px} .view{padding:10px 9px 9px}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ML Sticky Notes</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <nav class="views" role="tablist" aria-label="Sections">
    <button class="view" role="tab" data-view="sticky">Sticky notes<span class="count" id="c-sticky"></span></button>
    <button class="view" role="tab" data-view="formulas">Formulas<span class="count" id="c-formulas"></span></button>
    <button class="view" role="tab" data-view="lessons">Detailed notes<span class="count" id="c-lessons"></span></button>
    <button class="view" role="tab" data-view="interview">Interview prep<span class="count" id="c-interview"></span></button>
  </nav>

  <div class="controls">
    <div class="row"><span class="row-label">Day</span><div class="row" id="dayChips"></div></div>
    <div class="row" data-for="sticky"><span class="row-label">Type</span><div class="row" id="typeChips"></div></div>
    <div class="row" data-for="interview"><span class="row-label">Level</span><div class="row" id="levelChips"></div></div>
    <div class="row">
      <span class="row-label">Find</span>
      <input id="q" type="search" placeholder="Search, e.g. Bayes, axis, TF-IDF" aria-label="Search">
      <label class="toggle" data-for="sticky"><input type="checkbox" id="hideDone"> Hide notes I've got</label>
      <label class="toggle" data-for="interview"><input type="checkbox" id="hideReady"> Hide questions I'm ready for</label>
    </div>
  </div>

  <div class="tools" data-for="lessons interview">
    <button class="btn" type="button" id="expandAll">Expand all</button>
    <button class="btn" type="button" id="collapseAll">Collapse all</button>
    <button class="btn" type="button" id="randomQ" data-for="interview">Random question</button>
  </div>

  <main id="out"></main>
</div>

<script>
const R = String.raw;
const DAYS = {1:"Day 1 · Python", 2:"Day 2 · NumPy & Pandas", 3:"Day 3 · Probability", P:"Project · TextPulse"};
const DAY_TITLES = {1:"Python proficiency", 2:"NumPy, Pandas & EDA", 3:"Probability & Naive Bayes", P:"TextPulse: real-time spam & sentiment"};
const TYPES = {concept:{label:"Concept"}, pitfall:{label:"Pitfall"}, code:{label:"Syntax"}, rule:{label:"Rule of thumb"}};
const LEVELS = {basic:"Basic", mid:"Intermediate", adv:"Advanced"};
const SUBS = {
  sticky:"The points worth remembering from each day. Tick a note when you can explain it without looking.",
  formulas:"Every important formula: what each symbol means, a worked example with real numbers, and when to use it.",
  lessons:"The full explanation of each topic, written for a beginner, with examples and code.",
  interview:"Questions interviewers actually ask, with a short answer to say out loud and the full explanation behind it.",
};

const NOTES = [
  // ---------- Day 1 ----------
  {id:"d1-names", day:1, type:"concept", title:"Names point to objects",
   body:`<p>A variable is a label on an object. The <b>object</b> carries the type, not the name. That's why <code>x = 5</code> then <code>x = "hi"</code> is legal.</p>`},
  {id:"d1-alias", day:1, type:"pitfall", title:"b = a does not copy",
   body:`<pre><code>b = a; b.append(4)   # a changes too!
c = a.copy()         # independent copy</code></pre>`},
  {id:"d1-default", day:1, type:"pitfall", title:"Never use a mutable default",
   body:`<pre><code>def f(x, bucket=None):
    if bucket is None:
        bucket = []</code></pre><p>A default like <code>bucket=[]</code> is created once and shared by every call.</p>`},
  {id:"d1-structs", day:1, type:"concept", title:"The 4 core structures",
   body:`<table><tr><td><code>list</code></td><td>ordered, mutable</td></tr><tr><td><code>tuple</code></td><td>ordered, immutable</td></tr><tr><td><code>dict</code></td><td>key → value</td></tr><tr><td><code>set</code></td><td>unique values</td></tr></table>`},
  {id:"d1-comp", day:1, type:"code", title:"Comprehension = LINQ",
   body:`<pre><code>[x*x for x in nums if x > 2]
{k: v for k, v in pairs}</code></pre><p>The trailing <code>if</code> is Where; the front expression is Select.</p>`},
  {id:"d1-kwargs", day:1, type:"code", title:"*args and **kwargs",
   body:`<p><code>*args</code> → tuple of extra positional args.<br><code>**kwargs</code> → dict of keyword args.</p><pre><code>model = RandomForest(**config)</code></pre>`},
  {id:"d1-div", day:1, type:"pitfall", title:"/ vs //",
   body:`<p><code>7 / 2 = 3.5</code> (always a float)<br><code>7 // 2 = 3</code> (floor division)<br>Unlike C#, where 7/2 with ints gives 3.</p>`},
  {id:"d1-get", day:1, type:"code", title:"Safe dict lookup",
   body:`<pre><code>d.get("email", "none")</code></pre><p>Returns a default instead of raising <code>KeyError</code>.</p>`},
  {id:"d1-gen", day:1, type:"code", title:"Generator inside sum()",
   body:`<pre><code>sum(s.average for s in students)</code></pre><p>No square brackets, so no temporary list is built.</p>`},
  {id:"d1-self", day:1, type:"concept", title:"Methods are functions on the class",
   body:`<p><code>s.method(x)</code> runs <code>Student.method(s, x)</code>. <code>self</code> is just the first argument. Monkey-patching works, but keep methods in the class for production code.</p>`},
  {id:"d1-datadriven", day:1, type:"rule", title:"Data-driven code survives change",
   body:`<p>Loop over columns instead of naming them. Pass dependencies in as parameters instead of reading globals, or derive them from the data.</p>`},
  {id:"d1-round", day:1, type:"rule", title:"Round only for display",
   body:`<p>Never round in the middle of a calculation. Small errors add up across millions of rows.</p>`},
  {id:"d1-key", day:1, type:"rule", title:"Key by a unique ID",
   body:`<p>Two students named Ravi would overwrite each other in <code>{name: ...}</code>. Use the roll number or another unique key.</p>`},
  {id:"d1-impossible", day:1, type:"rule", title:"Impossible value → missing",
   body:`<p><b>Impossible</b> (105 out of 100): treat as NaN, then impute.<br><b>Plausible but extreme</b>: capping (winsorizing) is fine.</p>`},

  // ---------- Day 2 ----------
  {id:"d2-numpy", day:2, type:"concept", title:"Why NumPy is fast",
   body:`<p>One contiguous block of same-typed numbers, processed in compiled C. Vectorised code is typically 10–100× faster than a Python loop.</p>`},
  {id:"d2-axis", day:2, type:"rule", title:"The axis you name disappears",
   body:`<table><tr><td><code>axis=0</code></td><td>collapses rows → one value per column</td></tr><tr><td><code>axis=1</code></td><td>collapses columns → one value per row</td></tr></table><p>When in doubt, print <code>.shape</code>.</p>`},
  {id:"d2-mask", day:2, type:"code", title:"Boolean masks",
   body:`<pre><code>m[(m > 60) &amp; (m < 90)]</code></pre><p>Use <code>&amp;</code> and <code>|</code> with brackets, never <code>and</code>/<code>or</code>.</p>`},
  {id:"d2-broadcast", day:2, type:"concept", title:"Broadcasting",
   body:`<p>A (3, 4) matrix minus a (4,) row subtracts the row from every row.</p><pre><code>z = (X - X.mean(0)) / X.std(0)</code></pre>`},
  {id:"d2-seed", day:2, type:"code", title:"Seed your randomness",
   body:`<pre><code>rng = np.random.default_rng(42)</code></pre><p>Same seed, same numbers. Essential for reproducible experiments.</p>`},
  {id:"d2-loc", day:2, type:"code", title:"loc vs iloc",
   body:`<p><code>loc</code> → by <b>label</b> or condition<br><code>iloc</code> → by integer <b>position</b></p><pre><code>df.loc[df.math > 80, ["name"]]</code></pre>`},
  {id:"d2-sql", day:2, type:"code", title:"SQL → Pandas",
   body:`<table><tr><td>WHERE</td><td><code>df[df.x > 1]</code></td></tr><tr><td>GROUP BY</td><td><code>df.groupby("k")["v"].mean()</code></td></tr><tr><td>JOIN</td><td><code>df.merge(o, on="id", how="left")</code></td></tr><tr><td>ORDER BY</td><td><code>df.sort_values("v")</code></td></tr><tr><td>CASE</td><td><code>np.where(c, a, b)</code></td></tr></table>`},
  {id:"d2-rate", day:2, type:"rule", title:"Mean of a 0/1 column is a rate",
   body:`<pre><code>df.groupby("sex")["survived"].mean()</code></pre><p>Gives the survival rate per group. Use <code>.sum()</code> for counts.</p>`},
  {id:"d2-eda", day:2, type:"concept", title:"The EDA order",
   body:`<p>Inspect → missing values → target → univariate → bivariate → multivariate → statistical tests → features.</p>`},
  {id:"d2-leak", day:2, type:"pitfall", title:"Target leakage",
   body:`<p>Drop any column that reveals the answer. Titanic's <code>alive</code> is just <code>survived</code> in words. Leaving it in gives a 100% score and a useless model.</p>`},
  {id:"d2-baseline", day:2, type:"rule", title:"Always know the baseline",
   body:`<p>Predicting the majority class gives 62% on Titanic. A model is only useful if it clearly beats that.</p>`},
  {id:"d2-missing", day:2, type:"rule", title:"Handling missing values",
   body:`<p>Mostly missing (Titanic deck, 77%) → drop the column.<br>Important and partly missing → impute by <b>group</b> median.<br>Keep a <code>was_missing</code> flag.</p><pre><code>df.groupby(g)["age"].transform(
    lambda s: s.fillna(s.median()))</code></pre>`},
  {id:"d2-plots", day:2, type:"rule", title:"Pick the plot by the question",
   body:`<table><tr><td>One number</td><td>histogram</td></tr><tr><td>Categories</td><td>bar</td></tr><tr><td>Two numbers</td><td>scatter</td></tr><tr><td>Over time</td><td>line</td></tr><tr><td>Spread by group</td><td>box plot</td></tr></table>`},
  {id:"d2-corr", day:2, type:"pitfall", title:"Correlation has blind spots",
   body:`<p>Pearson correlation only sees <b>linear</b> links between <b>numeric</b> columns. Titanic's strongest predictor, <code>sex</code>, isn't in the matrix at all.</p>`},
  {id:"d2-skew", day:2, type:"rule", title:"Right-skewed → log transform",
   body:`<pre><code>df["log_fare"] = np.log1p(df["fare"])</code></pre><p><code>log1p</code> handles zeros safely.</p>`},
  {id:"d2-cut", day:2, type:"code", title:"Bin a number into bands",
   body:`<pre><code>pd.cut(df.age, bins=[0,12,18,60,80],
       labels=["child","teen","adult","60+"])</code></pre>`},

  // ---------- Day 3 ----------
  {id:"d3-freq", day:3, type:"concept", title:"Probability = long-run frequency",
   body:`<p>Not sure about a formula? Simulate it 100,000 times and count. The law of large numbers says the frequency settles on the true probability.</p>`},
  {id:"d3-complement", day:3, type:"rule", title:"\"At least one\" → use the complement",
   body:`<p>P(at least one) = 1 − P(none)</p><p>P(≥1 six in 4 rolls) = 1 − (5/6)⁴ = 0.518</p>`},
  {id:"d3-addition", day:3, type:"rule", title:"Addition rule",
   body:`<p>P(A or B) = P(A) + P(B) − P(A and B)</p><p>Drop the last term <b>only</b> when A and B are mutually exclusive.</p>`},
  {id:"d3-conditional", day:3, type:"concept", title:"Conditional probability",
   body:`<p>P(A | B) = P(A and B) / P(B)</p><p>Shrink the world to B, then ask how much of it is A.</p>`},
  {id:"d3-indep", day:3, type:"concept", title:"Independent vs dependent",
   body:`<table><tr><td>Independent</td><td>P(A|B) = P(A), so P(A and B) = P(A)·P(B)</td></tr><tr><td>Dependent</td><td>P(A and B) = P(A)·P(B|A)</td></tr></table><p>Cards with replacement are independent; without replacement they're dependent.</p>`},
  {id:"d3-feature", day:3, type:"rule", title:"Useful feature = dependent target",
   body:`<p>If P(target | feature) is the same for every feature value, the feature carries no information.</p><p>Titanic: P(survived | female) 0.74 vs P(survived) 0.38.</p>`},
  {id:"d3-bayes", day:3, type:"concept", title:"Bayes' theorem",
   body:`<p>P(A | B) = P(B | A) · P(A) / P(B)</p><table><tr><td>P(A)</td><td>prior</td></tr><tr><td>P(B|A)</td><td>likelihood</td></tr><tr><td>P(A|B)</td><td>posterior</td></tr></table>`},
  {id:"d3-total", day:3, type:"code", title:"Law of total probability",
   body:`<p>P(B) = P(B|A)·P(A) + P(B|not A)·P(not A)</p><p>This is the denominator in almost every Bayes problem.</p>`},
  {id:"d3-baserate", day:3, type:"pitfall", title:"The base-rate trap",
   body:`<p>1% have a disease; the test catches 99% with 5% false alarms. A positive result means only a <b>16.7%</b> chance of disease.</p><p>Count 10,000 people to see why.</p>`},
  {id:"d3-imbalance", day:3, type:"rule", title:"Rare class → don't trust accuracy",
   body:`<p>A fraud model with 99% recall still gives mostly false alarms when fraud is rare. Judge it by precision and recall (Day 9).</p>`},
  {id:"d3-rv", day:3, type:"concept", title:"Discrete vs continuous",
   body:`<table><tr><td>Discrete</td><td>countable values; PMF gives P(X = x)</td></tr><tr><td>Continuous</td><td>any value; PDF gives a density, P(X = exactly x) = 0</td></tr></table>`},
  {id:"d3-density", day:3, type:"pitfall", title:"PDF height isn't a probability",
   body:`<p>A density can be greater than 1. Only the <b>area</b> under the PDF is a probability, and the total area is always 1.</p>`},
  {id:"d3-cdf", day:3, type:"rule", title:"Ranges come from the CDF",
   body:`<p>F(x) = P(X ≤ x)</p><p>P(a < X ≤ b) = F(b) − F(a)</p>`},
  {id:"d3-dists", day:3, type:"concept", title:"Four distributions",
   body:`<table><tr><td>Bernoulli(p)</td><td>one yes/no trial</td></tr><tr><td>Binomial(n, p)</td><td>successes in n trials; mean np</td></tr><tr><td>Poisson(λ)</td><td>events per interval; mean λ</td></tr><tr><td>Normal(μ, σ)</td><td>sums of many small effects</td></tr></table>`},
  {id:"d3-scipy", day:3, type:"code", title:"scipy.stats methods",
   body:`<table><tr><td><code>.pmf / .pdf</code></td><td>height at x</td></tr><tr><td><code>.cdf(x)</code></td><td>P(X ≤ x)</td></tr><tr><td><code>.sf(x)</code></td><td>P(X > x)</td></tr><tr><td><code>.ppf(q)</code></td><td>value at percentile q</td></tr></table><pre><code>stats.binom(200, .03).sf(9)  # P(X ≥ 10)</code></pre>`},
  {id:"d3-sf", day:3, type:"pitfall", title:"sf(9) means \"10 or more\"",
   body:`<p>For discrete variables, <code>sf(k)</code> = P(X > k). To get P(X ≥ 10), call <code>sf(9)</code>.</p>`},
  {id:"d3-6895", day:3, type:"rule", title:"68–95–99.7 rule",
   body:`<p>For a normal distribution, 68% of values lie within 1σ of the mean, 95% within 2σ and 99.7% within 3σ.</p>`},
  {id:"d3-nb", day:3, type:"concept", title:"Naive Bayes in one line",
   body:`<p>score(class) = log P(class) + Σ log P(word | class)</p><p>"Naive" means words are assumed independent given the class. It's false, but it works well.</p>`},
  {id:"d3-laplace", day:3, type:"rule", title:"Laplace smoothing",
   body:`<p>(count + 1) / (total + vocab size)</p><p>Stops one unseen word from making the whole product 0.</p>`},
  {id:"d3-logs", day:3, type:"pitfall", title:"Multiply probabilities → add logs",
   body:`<p>(10⁻⁵)¹⁰⁰ underflows to 0.0. Summing the logs gives −1151, which is fine. Always work in log space for long products.</p>`},
  // ---------- Project: TextPulse ----------
  {id:"p-pipeline", day:"P", type:"concept", title:"TextPulse in one line",
   body:`<p>clean text → TF-IDF (1–2 word terms) → Logistic Regression → probability + top words → WebSocket → live dashboard.</p>`},
  {id:"p-scores", day:"P", type:"rule", title:"Numbers to quote",
   body:`<table><tr><td>Spam</td><td>97.95% acc · 98.1% precision · 97.1% recall</td></tr><tr><td>Sentiment</td><td>82.30% on 320,000 tweets</td></tr><tr><td>Scale</td><td>1.64M records · ~38,500/s</td></tr></table>`},
  {id:"p-linear", day:"P", type:"concept", title:"Linear = explainable",
   body:`<p>score = Σ (TF-IDF value × weight) + bias, then sigmoid → probability. Each word's value × weight is its exact contribution.</p>`},
  {id:"p-leak", day:"P", type:"pitfall", title:"Fit on training data only",
   body:`<p>The TF-IDF vocabulary and IDF come from the training split. Fitting them on all the data would leak test information.</p>`},
  {id:"p-tfidf", day:"P", type:"code", title:"The vectorizer settings",
   body:`<pre><code>TfidfVectorizer(ngram_range=(1, 2),
  min_df=3, max_features=200_000,
  sublinear_tf=True)</code></pre>`},
  {id:"p-static", day:"P", type:"rule", title:"Free hosting trick",
   body:`<p>Docker Spaces need PRO; static Spaces are free. Export the weights to JSON and run the maths in the browser, after verifying it matches scikit-learn.</p>`},
];

const LESSONS = [
  // ===================== Day 1: Python =====================
  {id:"l1-run", day:1, title:"1. How Python runs your code (and how it differs from C#)",
   body:R`<p>Python is <b>interpreted</b> and <b>dynamically typed</b>. You don't compile a project first; Python reads your file top to bottom and runs it. You also never declare types: the <b>object</b> knows its type, and a variable is only a <b>name tag</b> stuck on an object.</p>
<pre><code>x = 5          # the name x points to an int object 5
x = "hello"    # now x points to a str object; the 5 is thrown away
type(x)        # &lt;class 'str'&gt;</code></pre>
<table><tr><th></th><th>C#</th><th>Python</th></tr>
<tr><td>Types</td><td>checked at compile time</td><td>checked while running</td></tr>
<tr><td>Blocks</td><td>{ curly braces }</td><td>indentation (4 spaces)</td></tr>
<tr><td>Null</td><td>null</td><td>None</td></tr>
<tr><td>Logic</td><td>&amp;&amp;  ||  !</td><td>and  or  not</td></tr>
<tr><td>LINQ Select/Where</td><td>nums.Where(x =&gt; x &gt; 2).Select(x =&gt; x*x)</td><td>[x*x for x in nums if x &gt; 2]</td></tr></table>
<p><b>Everything is an object</b>, including numbers, functions and classes. That's why you can pass a function as an argument (<code>sorted(students, key=get_marks)</code>) or store models in a dictionary (<code>{"nb": MultinomialNB(), "lr": LogisticRegression()}</code>). ML code uses this constantly.</p>
<div class="tip"><b>Type hints</b> (<code>def grade(mark: float) -&gt; str:</code>) are optional labels for readers and tools like VS Code. Python does not enforce them when running.</div>`},

  {id:"l1-types", day:1, title:"2. Core types: int, float, str, bool, None",
   body:R`<ul>
<li><b>int</b>: whole numbers with no size limit. <code>2**100</code> just works, unlike C#'s <code>int</code>, which overflows.</li>
<li><b>float</b>: 64-bit decimals (C#'s <code>double</code>). Not exact: <code>0.1 + 0.2 == 0.30000000000000004</code>. Compare floats with <code>math.isclose(a, b)</code>, and use <code>decimal.Decimal</code> for money.</li>
<li><b>str</b>: text, <b>immutable</b>. <code>s.upper()</code> returns a NEW string. Use f-strings to format: <code>f"{name} scored {avg:.1f}"</code>.</li>
<li><b>bool</b>: <code>True</code>/<code>False</code>, and actually a kind of int (True == 1). That's why <code>sum([True, False, True])</code> is 2, and why the mean of a 0/1 column is a rate.</li>
<li><b>None</b>: "no value". Test it with <code>is None</code>, not <code>== None</code>.</li></ul>
<h4>Truthiness</h4>
<p>These all count as False in an <code>if</code>: <code>0, 0.0, "", [], {}, set(), None</code>. So <code>if marks:</code> means "if the list is not empty".</p>
<h4>Division</h4>
<pre><code>7 / 2    # 3.5   true division, always a float
7 // 2   # 3     floor division
7 % 2    # 1     remainder
-7 // 2  # -4    floors toward minus infinity (C# gives -3)</code></pre>`},

  {id:"l1-structs", day:1, title:"3. Data structures: list, tuple, dict, set",
   body:R`<table><tr><th>Structure</th><th>Example</th><th>Ordered?</th><th>Changeable?</th><th>Duplicates?</th><th>Typical use</th></tr>
<tr><td>list</td><td><code>[70, 85, 85]</code></td><td>yes</td><td>yes</td><td>yes</td><td>a sequence you grow or edit</td></tr>
<tr><td>tuple</td><td><code>(12.97, 77.59)</code></td><td>yes</td><td>no</td><td>yes</td><td>a fixed record; can be a dict key</td></tr>
<tr><td>dict</td><td><code>{"roll": 7, "name": "Ravi"}</code></td><td>insertion order</td><td>yes</td><td>keys unique</td><td>look up by key</td></tr>
<tr><td>set</td><td><code>{"ml", "dl"}</code></td><td>no</td><td>yes</td><td>no</td><td>uniqueness, membership tests</td></tr></table>
<h4>Speed (Big-O) worth knowing</h4>
<ul><li><code>x in my_list</code> checks every item: <b>O(n)</b>. <code>x in my_set</code> or <code>key in my_dict</code> uses a hash: <b>O(1)</b> on average. For 1 million lookups that's the difference between minutes and milliseconds.</li>
<li><code>list.append</code> is O(1); <code>list.insert(0, x)</code> shifts everything, O(n). Use <code>collections.deque</code> for queues.</li></ul>
<h4>Copying: the most common bug</h4>
<pre><code>a = [1, 2, 3]
b = a            # NOT a copy: two names, one list
b.append(4)      # a is now [1, 2, 3, 4] too
c = a.copy()     # shallow copy: new outer list
import copy
d = copy.deepcopy(nested)   # copies inner lists too</code></pre>
<p>A <b>shallow</b> copy duplicates the outer container but shares the inner objects. If a list holds lists, change an inner one and both copies see it. That's when you need <code>deepcopy</code>.</p>
<h4>Useful dict tools</h4>
<pre><code>d.get("email", "none")              # default instead of KeyError
from collections import Counter, defaultdict
Counter("free free cash".split())   # {'free': 2, 'cash': 1}
groups = defaultdict(list); groups["A"].append("Ravi")</code></pre>`},

  {id:"l1-loops", day:1, title:"4. Loops, comprehensions and generators",
   body:R`<pre><code>for i, name in enumerate(names, start=1):   # index + value
    print(i, name)
for name, mark in zip(names, marks):        # walk two lists together
    print(name, mark)</code></pre>
<h4>Comprehensions: a loop that builds a collection in one line</h4>
<pre><code>squares = [x*x for x in nums if x &gt; 2]           # list
lookup  = {s.roll: s for s in students}           # dict
grades  = {grade(m) for m in marks}               # set</code></pre>
<p>Read it as: <i>[what to keep] for [each item] in [collection] if [condition]</i>. It maps directly to LINQ: the <code>if</code> is Where and the front expression is Select.</p>
<h4>Generators: lazy, one value at a time</h4>
<pre><code>total = sum(m for m in marks)        # no [] → no temporary list in memory
def read_big_file(path):
    for line in open(path):
        yield line.strip()            # pauses here, resumes on next()</code></pre>
<p>A list stores all values in memory at once; a generator produces them on demand. For a 10 GB file, a generator uses almost no memory. TextPulse's live stream is an endless generator: it yields test messages forever.</p>
<div class="warn">A generator can be read only once. After <code>list(gen)</code> it's empty.</div>`},

  {id:"l1-funcs", day:1, title:"5. Functions: arguments, defaults, *args, **kwargs, scope",
   body:R`<pre><code>def grade(mark, pass_mark=40, *, strict=False):

    ...

grade(75, pass_mark=50)    # keyword
grade(75, strict=True)     # after *, arguments must be keyword-only</code></pre>
<h4>*args and **kwargs</h4>
<pre><code>def log(*args, **kwargs):
    print(args)     # tuple of extra positional values
    print(kwargs)   # dict of extra keyword values
log(1, 2, level="info")   # (1, 2)  {'level': 'info'}

config = {"n_estimators": 200, "max_depth": 8}
model = RandomForestClassifier(**config)   # unpack a dict into keyword args</code></pre>
<h4>The mutable default trap</h4>
<pre><code>def add(item, bucket=[]):      # BUG: one list, created once, shared forever
    bucket.append(item); return bucket
add(1); add(2)                 # [1, 2]  surprise!

def add(item, bucket=None):    # FIX
    if bucket is None:
        bucket = []
    bucket.append(item); return bucket</code></pre>
<p>Default values are evaluated <b>once</b>, when the function is defined, not on every call.</p>
<h4>Scope (LEGB)</h4>
<p>Python looks up a name in this order: <b>L</b>ocal (inside the function) → <b>E</b>nclosing function → <b>G</b>lobal (module) → <b>B</b>uilt-ins. Reading a global inside a function works, but assigning to it creates a new local variable unless you write <code>global x</code>. Better: pass values in as parameters.</p>
<h4>lambda</h4>
<pre><code>sorted(students, key=lambda s: s.average, reverse=True)</code></pre>
<p>A lambda is a one-expression function without a name. It's handy for <code>key=</code> arguments and pandas <code>.apply</code>.</p>`},

  {id:"l1-classes", day:1, title:"6. Classes and objects",
   body:R`<pre><code>class Student:
    school = "IIIT-H"                       # class attribute: shared by all

<ul><li><b>self</b> is just the object the method was called on. <code>s.average()</code> is really <code>Student.average(s)</code>. C# hides <code>this</code>; Python makes you write it.</li>

  // ===================== Day 2: NumPy, Pandas, EDA =====================
  {id:"l2-numpy", day:2, title:"1. NumPy arrays: what they are and why they're fast",
   body:R`<p>A NumPy <b>ndarray</b> is a block of memory holding numbers of <b>one type</b> (all float64, say), side by side. A Python list is an array of pointers to separate objects scattered in memory. Because NumPy knows the type and layout, it runs loops in compiled C ("vectorised"), typically <b>10–100× faster</b>.</p>
<pre><code>import numpy as np
a = np.array([[1, 2, 3], [4, 5, 6]])
a.shape   # (2, 3): 2 rows, 3 columns
a.ndim    # 2
a.dtype   # int64
a * 10                     # every element; no loop
np.zeros((3, 4)); np.ones(5); np.arange(0, 10, 2); np.linspace(0, 1, 5)
rng = np.random.default_rng(42); rng.normal(170, 10, size=1000)</code></pre>
<h4>Indexing</h4>
<pre><code>a[0, 2]        # row 0, column 2 → 3
a[:, 1]        # every row, column 1 → [2, 5]
a[a &gt; 2]       # boolean mask → [3, 4, 5, 6]
a[(a &gt; 1) &amp; (a &lt; 6)]   # use &amp; | ~ and brackets, not and/or</code></pre>
<div class="warn"><b>Slices are views, not copies.</b> <code>b = a[0]; b[0] = 99</code> changes <code>a</code> too. Use <code>a[0].copy()</code> when you need independence. Boolean or fancy indexing (<code>a[[0, 1]]</code>) always returns a copy.</div>`},

  {id:"l2-axis", day:2, title:"2. Axis, aggregation and broadcasting",
   body:R`<p><b>The axis you name is the one that disappears.</b> On a (rows, columns) array:</p>
<pre><code>m = np.array([[70, 80], [90, 60], [50, 100]])   # 3 students × 2 subjects
m.mean(axis=0)   # [70., 80.]       collapse rows → one value per subject
m.mean(axis=1)   # [75., 75., 75.]  collapse columns → one value per student</code></pre>
<p>In pandas it's the same: <code>df.mean()</code> gives one value per column, and <code>df.drop(columns=...)</code> is <code>axis=1</code>.</p>
<h4>Broadcasting: arithmetic on different shapes</h4>
<p>NumPy compares shapes from the <b>right</b>. Two dimensions fit if they're equal or one of them is 1; the 1 is "stretched" without copying memory.</p>
<pre><code>(3, 2) - (2,)    → OK: subtract a row from every row
(3, 2) - (3,)    → ERROR: 2 vs 3 don't match from the right
(3, 2) - (3, 1)  → OK: subtract one value per row

z = (m - m.mean(axis=0)) / m.std(axis=0)   # standardise each column</code></pre>
<div class="tip">When confused, print <code>.shape</code> after every step. Most NumPy bugs are shape bugs.</div>`},

  {id:"l2-pandas", day:2, title:"3. Pandas: Series, DataFrame, loading and inspecting",
   body:R`<p>A <b>Series</b> is one labelled column. A <b>DataFrame</b> is a table: several Series sharing one row index, like a SQL table in memory.</p>
<pre><code>import pandas as pd

df.shape            # (891, 15)
df.head()           # first 5 rows
df.info()           # column types and non-null counts → spot missing data
df.describe()       # count, mean, std, min, quartiles, max for numbers
df["sex"].value_counts(normalize=True)   # category shares
df.isna().sum()     # missing values per column</code></pre>
<h4>Selecting</h4>
<table><tr><th>You want</th><th>Code</th></tr>
<tr><td>one column (Series)</td><td><code>df["age"]</code></td></tr>
<tr><td>several columns</td><td><code>df[["age", "fare"]]</code></td></tr>
<tr><td>rows by condition</td><td><code>df[df.age &lt; 12]</code></td></tr>
<tr><td>rows + columns by <b>label</b></td><td><code>df.loc[df.age &lt; 12, ["name", "survived"]]</code></td></tr>
<tr><td>rows + columns by <b>position</b></td><td><code>df.iloc[0:5, 0:3]</code></td></tr></table>
<p><code>loc</code> slices <b>include</b> the end label; <code>iloc</code> slices exclude the end, like Python.</p>
<div class="warn"><b>SettingWithCopyWarning</b>: <code>df[df.age &gt; 60]["fare"] = 0</code> may modify a temporary copy and do nothing. Write <code>df.loc[df.age &gt; 60, "fare"] = 0</code> instead, in one step.</div>`},

  {id:"l2-clean", day:2, title:"4. Cleaning: missing values, types, duplicates",
   body:R`<h4>Missing values: decide per column</h4>
<table><tr><th>Situation</th><th>Action</th><th>Titanic example</th></tr>
<tr><td>Mostly missing</td><td>drop the column</td><td>deck: 77% missing</td></tr>
<tr><td>Important, partly missing</td><td>impute by GROUP median + add a flag</td><td>age: 20% missing → median per class and sex</td></tr>
<tr><td>Tiny number of rows</td><td>fill with the mode, or drop those rows</td><td>embarked: 2 missing</td></tr></table>
<pre><code>df["age_missing"] = df["age"].isna().astype(int)          # keep the information
df["age"] = df.groupby(["pclass", "sex"])["age"].transform(
    lambda s: s.fillna(s.median()))
df["embarked"] = df["embarked"].fillna(df["embarked"].mode()[0])</code></pre>
<p><b>Why group medians?</b> First-class passengers were older than third-class ones. One overall median would blur that pattern.</p>
<p><b>Why a flag?</b> Sometimes the fact that a value is missing is itself predictive (e.g. no age recorded for many third-class victims).</p>
<h4>Other checks</h4>
<pre><code>df.duplicated().sum(); df = df.drop_duplicates()
df["date"] = pd.to_datetime(df["date"])
df["pclass"] = df["pclass"].astype("category")      # less memory, clear meaning
df["age_band"] = pd.cut(df.age, [0, 12, 18, 60, 80], labels=["child", "teen", "adult", "60+"])</code></pre>
<div class="warn">Fit any imputation (medians, means) on the <b>training</b> data only, then apply it to the test data. Otherwise test information leaks into training.</div>`},

  {id:"l2-group", day:2, title:"5. groupby, merge, pivot: SQL in pandas",
   body:R`<table><tr><th>SQL</th><th>pandas</th></tr>
<tr><td>SELECT a, b</td><td><code>df[["a", "b"]]</code></td></tr>
<tr><td>WHERE x &gt; 1</td><td><code>df[df.x &gt; 1]</code> or <code>df.query("x &gt; 1")</code></td></tr>
<tr><td>GROUP BY k, AVG(v)</td><td><code>df.groupby("k")["v"].mean()</code></td></tr>
<tr><td>several aggregates</td><td><code>df.groupby("k").agg(avg=("v", "mean"), n=("v", "size"))</code></td></tr>
<tr><td>LEFT JOIN</td><td><code>df.merge(other, on="id", how="left")</code></td></tr>
<tr><td>UNION ALL</td><td><code>pd.concat([df1, df2])</code></td></tr>
<tr><td>ORDER BY v DESC</td><td><code>df.sort_values("v", ascending=False)</code></td></tr>
<tr><td>CASE WHEN</td><td><code>np.where(df.age &lt; 18, "minor", "adult")</code></td></tr></table>
<h4>agg vs transform</h4>
<ul><li><code>groupby().agg()</code> returns <b>one row per group</b> (a summary).</li>
<li><code>groupby().transform()</code> returns <b>one value per original row</b> (the group's value repeated), so you can put it back as a column, as in group-median imputation.</li></ul>
<pre><code>pd.pivot_table(df, values="survived", index="sex", columns="pclass", aggfunc="mean")
#          1     2     3
# female 0.97  0.92  0.50
# male   0.37  0.16  0.14</code></pre>
<div class="tip">Avoid <code>.apply</code> with a Python function on big data: it's a hidden loop. Vectorised operations (<code>df.a * df.b</code>, <code>np.where</code>, <code>.str</code> methods) are far faster.</div>`},

  {id:"l2-viz", day:2, title:"6. Visualisation: choosing the right plot",
   body:R`<table><tr><th>Question</th><th>Plot</th><th>Seaborn</th></tr>
<tr><td>How is one number distributed?</td><td>histogram / KDE</td><td><code>sns.histplot(df, x="age", kde=True)</code></td></tr>

  {id:"l2-eda", day:2, title:"7. The EDA workflow on Titanic, with findings",
   body:R`<ol><li><b>Inspect</b>: 891 rows, 15 columns; types; <code>info()</code>.</li>
<li><b>Missing values</b>: deck 77%, age 20%, embarked 2 rows.</li>
<li><b>Target</b>: 38.4% survived → baseline accuracy 61.6%.</li>
<li><b>Univariate</b>: fare is heavily right-skewed (median 14.45, max 512) → log transform.</li>
<li><b>Bivariate</b>: survival by sex (female 74%, male 19%) and class (1st 63%, 2nd 47%, 3rd 24%).</li>

<li><b>Statistical tests</b>: chi-square test for sex vs survival gives p ≈ 10⁻⁵⁸, so the link is not chance.</li>
<li><b>Features</b>: family_size = sibsp + parch + 1, is_alone, title from the name, age bands.</li></ol>
<h4>Two traps EDA must catch</h4>
<ul><li><b>Target leakage</b>: the column <code>alive</code> is just <code>survived</code> in words. A model would score 100% and be useless. Ask of every column: <i>would I know this value at prediction time?</i></li>

  {id:"l2-stats", day:2, title:"8. Descriptive statistics and SciPy tests",
   body:R`<ul><li><b>Centre</b>: mean (sensitive to outliers), median (robust), mode (most common; for categories).</li>
<li><b>Spread</b>: range, variance, standard deviation, IQR.</li>
<li><b>Shape</b>: skewness. Right-skewed (long tail to the right, mean &gt; median) is typical for money. Kurtosis measures how heavy the tails are.</li></ul>
<p>If mean ≫ median, the data is right-skewed: report the median.</p>
<h4>Hypothesis tests in one paragraph (more on Day 4)</h4>
<p>Start by assuming "no effect" (the <b>null hypothesis</b>). The <b>p-value</b> is the probability of seeing a difference at least this big if there really were no effect. A small p (below 0.05) means the data would be surprising under "no effect", so you reject it.</p>
<pre><code>from scipy import stats
stats.ttest_ind(df[df.survived == 1].fare, df[df.survived == 0].fare)   # compare two means
table = pd.crosstab(df.sex, df.survived)
stats.chi2_contingency(table)                                            # two categories linked?</code></pre>
<div class="warn">A p-value is NOT the probability that the null hypothesis is true, and a tiny p doesn't mean a big or important effect. With huge datasets, trivial differences become "significant".</div>`},

  // ===================== Day 3: Probability =====================
  {id:"l3-what", day:3, title:"1. What probability means: events, sample spaces, simulation",
   body:R`<p>The <b>sample space</b> is the set of every possible outcome (a die: {1, 2, 3, 4, 5, 6}). An <b>event</b> is any group of outcomes ("even" = {2, 4, 6}). A probability is a number from 0 (impossible) to 1 (certain).</p>
<ul><li><b>Frequentist view</b>: probability is the long-run frequency. Flip a coin 100,000 times and heads settles near 0.5. This is the <b>law of large numbers</b>.</li>
<li><b>Bayesian view</b>: probability is a degree of belief that you update as evidence arrives (Bayes' theorem).</li></ul>
<p>In ML you use both: you estimate probabilities from data counts (frequentist), and models like Naive Bayes update beliefs with evidence (Bayesian).</p>
<h4>When in doubt, simulate</h4>
<pre><code>rng = np.random.default_rng(42)
rolls = rng.integers(1, 7, size=(100_000, 4))    # 100k experiments of 4 rolls
(rolls == 6).any(axis=1).mean()                  # ≈ 0.518, matches 1 − (5/6)**4</code></pre>
<p>A simulation is a great way to check a formula you're unsure about, in an exam or an interview.</p>`},

  {id:"l3-rules", day:3, title:"2. The rules: complement, addition, multiplication",
   body:R`<ul><li><b>Complement</b>: \(P(\text{not }A) = 1 - P(A)\). Use it for every "at least one" question.</li>
<li><b>Addition (OR)</b>: \(P(A \cup B) = P(A) + P(B) - P(A \cap B)\). You subtract the overlap because it was counted twice.</li>
<li><b>Multiplication (AND)</b>: \(P(A \cap B) = P(A)\,P(B \mid A)\). If A and B are independent, this becomes \(P(A)\,P(B)\).</li></ul>
<h4>Mutually exclusive vs independent: not the same thing</h4>
<table><tr><th></th><th>Mutually exclusive</th><th>Independent</th></tr>
<tr><td>Meaning</td><td>can't happen together</td><td>one doesn't affect the other</td></tr>
<tr><td>Formula</td><td>\(P(A \cap B) = 0\)</td><td>\(P(A \cap B) = P(A)P(B)\)</td></tr>
<tr><td>Example</td><td>one roll: "1" and "6"</td><td>two separate rolls</td></tr></table>
<p>Mutually exclusive events (each with probability above 0) are always <b>dependent</b>: if one happens, you know the other didn't. That's a favourite interview trick.</p>
<h4>With vs without replacement</h4>
<p>Drawing two aces <b>without</b> replacement: 4/52 × 3/51 = 0.0045 (the second draw depends on the first). <b>With</b> replacement: (4/52)² = 0.0059 (independent). Train/test splitting is sampling without replacement; bootstrap sampling (Random Forests, Day 11) is with replacement.</p>`},

  {id:"l3-cond", day:3, title:"3. Conditional probability and independence in data",
   body:R`<p>\(P(A \mid B)\) means: <b>shrink the world to only the cases where B happened</b>, then ask what fraction of those are A.</p>
<p>In pandas, the condition is a filter:</p>
<pre><code>df.survived.mean()                        # P(survived)          = 0.384
df[df.sex == "female"].survived.mean()    # P(survived | female) = 0.742
df[df.sex == "male"].survived.mean()      # P(survived | male)   = 0.189</code></pre>
<p>Since P(survived | female) ≠ P(survived), survival and sex are <b>dependent</b>, so sex is a useful feature. A feature is useful exactly when the target depends on it. If P(target | feature value) were the same for every value, the feature would carry no information.</p>
<div class="warn">\(P(A \mid B) \ne P(B \mid A)\). P(positive test | disease) = 0.99 is very different from P(disease | positive test) = 0.17. Confusing the two is called the <b>prosecutor's fallacy</b>.</div>`},

  {id:"l3-bayes", day:3, title:"4. Bayes' theorem, step by step, with 10,000 people",
   body:R`\[P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}\]
<p>Problem: 1% of people have a disease. The test catches 99% of sick people (sensitivity) and wrongly flags 5% of healthy people (false-positive rate). You test positive. How likely are you to be sick?</p>
<p>Imagine <b>10,000 people</b>:</p>
<table><tr><th></th><th>Test positive</th><th>Test negative</th><th>Total</th></tr>
<tr><td>Sick (1%)</td><td>99</td><td>1</td><td>100</td></tr>
<tr><td>Healthy (99%)</td><td>495</td><td>9,405</td><td>9,900</td></tr>
<tr><td>Total</td><td><b>594</b></td><td>9,406</td><td>10,000</td></tr></table>
<p>Of the 594 positives, only 99 are sick: 99 / 594 = <b>16.7%</b>. The 5% false alarms on a huge healthy group swamp the true positives from a tiny sick group. This is the <b>base-rate fallacy</b>: ignoring how rare the condition is to begin with.</p>
<h4>The four parts</h4>
<ul><li><b>Prior</b> P(sick) = 0.01: what you believed before the test.</li>
<li><b>Likelihood</b> P(positive | sick) = 0.99: how well the evidence fits the hypothesis.</li>
<li><b>Evidence</b> P(positive) = 0.0594: all the ways to test positive (law of total probability).</li>
<li><b>Posterior</b> P(sick | positive) = 0.167: the updated belief. A second positive test would use 0.167 as the new prior → 0.80.</li></ul>
<div class="tip">This is exactly the precision problem in ML. With rare classes (fraud, disease), even a model with high recall produces mostly false alarms. That's why accuracy alone is misleading on imbalanced data.</div>`},

  {id:"l3-rv", day:3, title:"5. Random variables: PMF, PDF, CDF, expectation",
   body:R`<p>A <b>random variable</b> is a number decided by chance: the roll of a die, the number of spam emails tomorrow, someone's height.</p>
<table><tr><th></th><th>Discrete</th><th>Continuous</th></tr>
<tr><td>Values</td><td>countable: 0, 1, 2, …</td><td>any value in a range</td></tr>
<tr><td>Function</td><td><b>PMF</b>: P(X = x), a real probability</td><td><b>PDF</b>: a density; P(X = exactly x) = 0</td></tr>
<tr><td>Probabilities</td><td>add PMF values</td><td>area under the PDF</td></tr>
<tr><td>Examples</td><td>Bernoulli, Binomial, Poisson</td><td>Uniform, Normal, Exponential</td></tr></table>
<p>The <b>CDF</b> works for both: \(F(x) = P(X \le x)\). It rises from 0 to 1, and any range is a subtraction: \(P(a < X \le b) = F(b) - F(a)\).</p>
<div class="warn">A PDF value can be greater than 1 (a narrow normal with σ = 0.1 peaks at about 4). Only areas are probabilities.</div>
<h4>Expectation and variance</h4>
<p>\(E[X] = \sum x\,P(x)\) is the long-run average. For a die it's 3.5, a value you can never actually roll. \(\operatorname{Var}(X) = E[X^2] - (E[X])^2\) measures spread. Useful rules: \(E[aX + b] = aE[X] + b\), and \(E[X + Y] = E[X] + E[Y]\) <b>always</b> holds, even when X and Y are dependent.</p>
<pre><code>from scipy import stats
d = stats.binom(n=10, p=0.5)
d.pmf(5)   # P(X = 5)   = 0.246
d.cdf(5)   # P(X ≤ 5)   = 0.623
d.sf(5)    # P(X &gt; 5)   = 0.377
d.ppf(.9)  # 90th percentile = 7
d.mean(), d.var()   # 5.0, 2.5</code></pre>`},

  {id:"l3-dists", day:3, title:"6. The distributions you must know, and when to use each",
   body:R`<table><tr><th>Distribution</th><th>Story</th><th>Mean</th><th>Variance</th><th>ML example</th></tr>
<tr><td>Bernoulli(p)</td><td>one yes/no trial</td><td>p</td><td>p(1−p)</td><td>one email is spam or not</td></tr>
<tr><td>Binomial(n, p)</td><td>successes in n independent trials</td><td>np</td><td>np(1−p)</td><td>clicks out of 200 ad views</td></tr>
<tr><td>Poisson(λ)</td><td>count of events in an interval</td><td>λ</td><td>λ</td><td>server errors per hour</td></tr>
<tr><td>Uniform(a, b)</td><td>every value equally likely</td><td>(a+b)/2</td><td>(b−a)²/12</td><td>random weight initialisation</td></tr>
<tr><td>Normal(μ, σ)</td><td>sum of many small effects</td><td>μ</td><td>σ²</td><td>measurement errors, regression residuals</td></tr></table>
<h4>How to choose</h4>
<ul><li>Fixed number of trials, counting successes → <b>Binomial</b>.</li>
<li>No fixed number of trials, counting events in time or space → <b>Poisson</b>. For large n and small p, the Binomial ≈ Poisson(λ = np).</li>
<li>Continuous measurement, symmetric bell → <b>Normal</b>. Check with a histogram or Q-Q plot.</li></ul>
<h4>The normal distribution's rules</h4>
<p>68% of values lie within 1σ of the mean, 95% within 2σ (more precisely 1.96σ, the basis of 95% confidence intervals) and 99.7% within 3σ. Any normal value converts to the standard normal with \(z = (x - \mu)/\sigma\).</p>
<p><b>Why it's everywhere</b>: the Central Limit Theorem (Day 4) says averages of many independent values are approximately normal, whatever the original distribution.</p>`},

  {id:"l3-nb", day:3, title:"7. Naive Bayes spam filter, worked by hand",
   body:R`<p>Training data: four emails.</p>
<table><tr><th>Email</th><th>Label</th><th>Words kept</th></tr>
<tr><td>Win a FREE prize!</td><td>spam</td><td>win, free, prize</td></tr>
<tr><td>Free cash, click now</td><td>spam</td><td>free, cash, click</td></tr>
<tr><td>Team meeting on Friday</td><td>ham</td><td>team, meeting, friday</td></tr>
<tr><td>Free lunch for the team</td><td>ham</td><td>free, lunch, team</td></tr></table>
<p><b>Step 1 – priors</b>: 2 of 4 emails are spam → P(spam) = P(ham) = 0.5.</p>
<p><b>Step 2 – word counts</b>: spam has 6 words, ham has 6, and the vocabulary has 9 distinct words.</p>
<p><b>Step 3 – smoothed likelihoods</b> (add 1 to every count, add |V| = 9 to every total): P(free | spam) = (2+1)/(6+9) = 3/15; P(cash | spam) = 2/15; P(free | ham) = 2/15; P(cash | ham) = (0+1)/15 = 1/15.</p>
<p><b>Step 4 – score a new email</b> "free cash prize":</p>
\[\text{spam: } 0.5 \times \tfrac{3}{15} \times \tfrac{2}{15} \times \tfrac{2}{15} = 0.00178 \qquad \text{ham: } 0.5 \times \tfrac{2}{15} \times \tfrac{1}{15} \times \tfrac{1}{15} = 0.00030\]
<p><b>Step 5 – normalise</b>: P(spam | email) = 0.00178 / (0.00178 + 0.00030) = <b>0.857 → SPAM</b>.</p>
<h4>Why "naive"?</h4>
<p>It assumes every word is independent of the others once you know the class, so it can just multiply. That's false ("click" and "here" go together), but the classifier still ranks classes well, because it only needs the <b>biggest</b> score to win, not exact probabilities.</p>
<h4>Two engineering fixes</h4>
<ul><li><b>Laplace smoothing</b>: without the +1, P(cash | ham) = 0 and any ham email containing "cash" gets a score of exactly 0.</li>
<li><b>Logs</b>: a long email multiplies hundreds of small numbers, which underflows to 0.0. Add log-probabilities instead; the winner is the same.</li></ul>
<pre><code>from sklearn.feature_extraction.text import CountVectorizer
from sklearn.naive_bayes import MultinomialNB
from sklearn.pipeline import make_pipeline
model = make_pipeline(CountVectorizer(), MultinomialNB(alpha=1.0))
model.fit(texts, labels)
model.predict_proba(["free cash prize"])</code></pre>`},

  {id:"l3-ml", day:3, title:"8. Where probability shows up in machine learning",
   body:R`<ul><li><b>Classifier outputs</b> are probabilities: <code>predict_proba</code>. The label is just "probability above a threshold" (0.5 by default). Moving the threshold trades precision for recall.</li>
<li><b>Training = maximum likelihood</b>: logistic regression picks the weights that make the observed labels most probable. Minimising log loss is the same thing.</li>
<li><b>Imbalanced classes</b>: the base-rate effect means rare-class predictions need precision/recall, not accuracy.</li>
<li><b>Calibration</b>: a model saying "90% sure" should be right about 90% of the time. Naive Bayes tends to be overconfident (probabilities pushed to 0 or 1) because its independence assumption double-counts correlated words.</li>
<li><b>Sampling</b>: train/test splits, bootstrapping, A/B tests and dropout all rest on probability.</li></ul>`},

  {id:"lp-overview", day:"P", title:"1. The whole pipeline in one picture",
   body:R`<p><b>Raw data</b> (Sentiment140 1.6M tweets, SMS Spam Collection 5,572, Enron-Spam 33,716 emails) → <b>load and standardise</b> into one table (label, text, source) → <b>clean text</b> → <b>stratified 80/20 split</b> → <b>TF-IDF</b> (fitted on training data only) → train <b>Naive Bayes and Logistic Regression</b> → <b>compare on the test set</b>, keep the better one → <b>save</b> the pipeline with joblib → <b>serve</b> with FastAPI and stream predictions over a WebSocket → <b>dashboard</b>. For the free live site, the models are exported to JSON and run in the browser.</p>
