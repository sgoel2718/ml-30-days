<tr><td>Spam (email + SMS)</td><td>7,133</td><td>97.52%</td><td><b>97.95%</b></td></tr>
<tr><td>Sentiment (tweets)</td><td>320,000</td><td>80.33%</td><td><b>82.30%</b></td></tr></table>`},

  {id:"lp-text", day:"P", title:"2. Text cleaning and TF-IDF features",
   body:R`<p><b>Cleaning</b>: lowercase; links → the word "url"; @names → "user"; remove HTML tags, digits and punctuation; keep apostrophes ("don't") and small words like "not", because "not good" is the opposite of "good".</p>
<p><b>Tokens</b>: the pattern <code>[a-z][a-z']+</code> (2+ letters). <b>N-grams (1, 2)</b> adds word pairs, so "not good" and "click here" become features in their own right.</p>
<p><b>TF-IDF</b> gives each term a weight: high when it's frequent in this message (TF) but rare across messages (IDF). Settings used and why:</p>
<ul><li><code>min_df=3</code>: ignore terms in fewer than 3 messages (typos, noise; reduces overfitting).</li>
<li><code>max_features=200,000</code>: cap memory.</li>
<li><code>sublinear_tf=True</code>: 1 + ln(count), so repetition has diminishing returns.</li>
<li>L2 normalisation: message length doesn't inflate scores.</li>
<li>Vocabulary learned from a 300k sample of the <b>training</b> data: fitting on all 1.28M tweets with bigrams would need many GB of RAM, and fitting on test data would leak.</li></ul>
<div class="tip">Why not word embeddings or BERT? TF-IDF + a linear model is a strong, fast baseline: it trains in seconds to a minute, scores about 38,500 messages per second on one CPU, and every prediction is explainable word by word. A transformer would likely gain a few points on sentiment (sarcasm, context) at a much higher cost.</div>`},

  {id:"lp-models", day:"P", title:"3. Naive Bayes vs Logistic Regression",
   body:R`<table><tr><th></th><th>Multinomial Naive Bayes</th><th>Logistic Regression</th></tr>
<tr><td>Type</td><td>generative: models P(words | class)</td><td>discriminative: models P(class | words) directly</td></tr>
<tr><td>Training</td><td>counting, one pass (0.1 s on spam)</td><td>optimisation (0.9 s spam, 58 s sentiment)</td></tr>
<tr><td>Assumption</td><td>words independent given the class</td><td>none about word independence</td></tr>
<tr><td>Strength</td><td>tiny data, very fast</td><td>usually more accurate with enough data; better probabilities</td></tr>
<tr><td>Settings</td><td>alpha = 0.1 (smoothing)</td><td>C = 4 (weaker L2 regularisation), liblinear solver</td></tr></table>
<p>Logistic regression won both tasks because correlated words (like "click" and "here") get their weights learned jointly, instead of being counted twice. Both models are <b>linear</b>: score = Σ value × weight + bias, which makes them explainable.</p>`},

  {id:"lp-eval", day:"P", title:"4. Evaluation done honestly",
   body:R`<ul><li><b>Stratified split</b> keeps the spam/ham ratio identical in train and test, with a fixed seed (42) so results are reproducible.</li>
<li><b>The test set is never used for any fitting</b>: not the vocabulary, not the IDF, not model selection by peeking.</li>
<li><b>Spam confusion matrix</b>: TP 2,960, FP 58, FN 88, TN 4,027 → precision 98.1%, recall 97.1%.</li>
<li><b>Accuracy by source</b>: email 98.4%, SMS 95.1%. SMS is harder: there's less data and the text is short.</li>
<li><b>Live check</b>: the dashboard replays only held-out messages and compares each prediction with the true label in real time.</li>
<li><b>Low-confidence flag</b>: below 65% the model is close to guessing, and the UI says so.</li></ul>
<h4>Known limitations</h4>
<ul><li>Old data: Enron emails are from 1999–2005 and SMS from about 2011, so modern phishing wording is under-represented.</li>
<li>Sentiment140 labels came from emoticons (distant supervision), so they're noisy. That's partly why accuracy tops out around 82%.</li>
<li>Out of domain: the spam model is less sure on tweet-style text.</li></ul>`},

  {id:"lp-serve", day:"P", title:"5. Serving: FastAPI, WebSocket, and the browser engine",
   body:R`<p><b>FastAPI server</b> (<code>app/main.py</code>): loads both models once at start-up (<code>lifespan</code>), exposes REST endpoints (<code>/api/analyze</code>, <code>/api/status</code>, <code>/api/metrics</code>, stream controls), validates input with Pydantic, and runs an <b>async</b> background loop that classifies the next test message and pushes it to every open dashboard over a <b>WebSocket</b>.</p>
<p><b>Why a WebSocket?</b> The server pushes results the moment they exist (up to 200/s). Polling a REST endpoint would waste requests and add delay.</p>
<p><b>The dashboard</b> batches incoming results and redraws once per animation frame, because redrawing for every message at 200/s would freeze the page.</p>
<p><b>Free live deployment</b>: Hugging Face now charges for server (Docker) Spaces, but static Spaces are free and never sleep. Because logistic regression is just "sum of value × weight + bias, then sigmoid", the vocabulary, IDF values, weights and bias were exported to JSON (gzipped 17 MB → 5 MB), and <code>engine.js</code> repeats the same maths in JavaScript. A verification step confirmed identical labels on 6,000 test messages before export. GitHub Actions redeploys on every push and checks the site daily.</p>`},
);

const INTERVIEW = [
  // ===================== Day 1: Python =====================
  {id:"i1-listtuple", day:1, level:"basic", q:"What's the difference between a list and a tuple? When would you use each?",
   say:R`A list is mutable and a tuple is immutable. I use a list for a collection that changes, and a tuple for a fixed record, especially as a dictionary key or a function's multiple return values.`,
   a:R`<ul><li><b>Mutability</b>: <code>lst.append(4)</code> works; a tuple has no append, and <code>t[0] = 1</code> raises TypeError.</li>
<li><b>Hashable</b>: a tuple of immutable items can be a dict key or set member, e.g. <code>{(12.97, 77.59): "Chennai"}</code>. A list can't.</li>
<li><b>Intent</b>: a tuple signals "this shape is fixed" (a coordinate, an RGB colour, a (name, score) pair).</li>
<li><b>Performance</b>: tuples are slightly smaller and faster to create, but that's rarely the reason to choose one.</li></ul>
<p><b>Follow-up</b>: "Can a tuple change?" Its own slots can't, but if it holds a list, that inner list can still be modified: <code>t = ([1], 2); t[0].append(3)</code> works.</p>`},
  {id:"i1-mutable", day:1, level:"basic", q:"What are mutable and immutable types? Why does it matter?",
   say:R`Immutable objects (int, float, str, tuple) can't be changed after creation; operations return new objects. Mutable ones (list, dict, set) change in place, so every name pointing to them sees the change.`,
   a:R`<pre><code>s = "hi"; s.upper()      # returns "HI"; s is still "hi"
a = [1, 2]; b = a; b.append(3)   # a is [1, 2, 3]: same object</code></pre>
<p>It matters for: (1) <b>aliasing bugs</b> when two names share one list; (2) <b>dict keys</b>, which must be immutable (hashable); (3) <b>function arguments</b>: a function can modify a list you pass in, but can't modify an int.</p>`},
  {id:"i1-args", day:1, level:"basic", q:"Explain *args and **kwargs.",
   say:R`*args collects extra positional arguments into a tuple; **kwargs collects extra keyword arguments into a dict. They're also used the other way round, to unpack a list or dict into a call.`,
   a:R`<pre><code>def f(*args, **kwargs): print(args, kwargs)
f(1, 2, a=3)                      # (1, 2) {'a': 3}
params = {"C": 4.0, "max_iter": 1000}
LogisticRegression(**params)      # same as LogisticRegression(C=4.0, max_iter=1000)</code></pre>
<p>Common uses: wrapper functions and decorators that pass everything through, and building models from config files or hyperparameter grids.</p>`},
  {id:"i1-self", day:1, level:"basic", q:"What is self, and what does __init__ do?",
   say:R`__init__ runs when an object is created and sets up its attributes. self is the object the method is working on. Python passes it automatically as the first argument.`,
   a:R`<p><code>s.add_mark(90)</code> is translated to <code>Student.add_mark(s, 90)</code>, so inside the method <code>self</code> is <code>s</code>. It's the same idea as <code>this</code> in C#, but explicit. <code>__init__</code> isn't technically the constructor (<code>__new__</code> creates the object); it initialises the new object.</p>`},
  {id:"i1-isvseq", day:1, level:"mid", q:"What's the difference between is and ==?",
   say:R`== compares values; "is" checks whether two names point to the very same object. Use "is" only for None, True and False.`,
   a:R`<pre><code>a = [1, 2]; b = [1, 2]
a == b   # True  (same contents)
a is b   # False (two different list objects)
x is None   # the correct way to test for None</code></pre>
<p>Trap: small integers (−5 to 256) and some strings are cached, so <code>is</code> may accidentally return True for them. Never rely on that.</p>`},
  {id:"i1-default", day:1, level:"mid", q:"What's wrong with def f(x, items=[])?",
   say:R`Default values are evaluated once, when the function is defined, so every call shares the same list. Use None as the default and create the list inside the function.`,
   a:R`<pre><code>def f(x, items=[]): items.append(x); return items
f(1)  # [1]
f(2)  # [1, 2]   ← the list survived between calls

def f(x, items=None):
    if items is None:
        items = []
    items.append(x); return items</code></pre>
<p>The same applies to dict and set defaults, or any mutable object.</p>`},
  {id:"i1-copy", day:1, level:"mid", q:"Shallow copy vs deep copy?",
   say:R`A shallow copy creates a new outer container but shares the inner objects. A deep copy recursively copies everything, so the two are fully independent.`,
   a:R`<pre><code>import copy
grid = [[1, 2], [3, 4]]
s = grid.copy()          # or list(grid), grid[:]
s[0].append(99)          # grid[0] changes too: inner lists are shared
d = copy.deepcopy(grid)
d[0].append(7)           # grid is unaffected</code></pre>
<p>pandas: <code>df.copy()</code> is deep by default for the data. Use it when you take a subset you plan to modify.</p>`},
  {id:"i1-comp", day:1, level:"mid", q:"List comprehension vs generator expression: when would you use each?",
   say:R`A list comprehension builds the whole list in memory now; a generator expression produces items one at a time when asked. I use generators for large or streaming data, or when I only need to loop once.`,
   a:R`<pre><code>sum([x*x for x in range(10**7)])   # builds a 10-million-item list first
sum(x*x for x in range(10**7))     # constant memory</code></pre>
<p>Use a list when you need to index it, loop over it more than once, or know its length. A generator is exhausted after one pass.</p>`},
  {id:"i1-dict", day:1, level:"mid", q:"How does a dictionary work, and what's the time complexity of lookups?",
   say:R`A dict is a hash table: Python hashes the key to find a slot, so lookup, insert and delete are O(1) on average. That's why keys must be hashable (immutable).`,
   a:R`<p>Worst case is O(n) when many keys collide, but that's rare. Since Python 3.7, dicts keep insertion order. Practical takeaway: for membership tests on large data, convert a list to a set first. <code>x in big_list</code> is O(n) per check; <code>x in big_set</code> is O(1).</p>`},
  {id:"i1-except", day:1, level:"mid", q:"How do you handle errors well in Python?",
   say:R`Catch specific exceptions where I can actually handle them, let unexpected ones surface, clean up with finally or a with-block, and raise clear errors early when input is invalid.`,
   a:R`<ul><li>Avoid a bare <code>except:</code>. It also catches KeyboardInterrupt and hides bugs.</li>
<li>Use <code>with</code> for files, connections and locks.</li>
<li>Validate at boundaries: <code>if not 0 &lt;= mark &lt;= 100: raise ValueError(...)</code>.</li>
<li>Log the exception with context (<code>logger.exception(...)</code>) instead of printing.</li>
<li>Python style is EAFP ("easier to ask forgiveness than permission"): try the operation and handle the failure, rather than checking every condition first.</li></ul>`},
  {id:"i1-gil", day:1, level:"adv", q:"What is the GIL? Does it hurt machine-learning code?",
   say:R`The Global Interpreter Lock lets only one thread execute Python bytecode at a time. It limits CPU-bound pure-Python threading, but NumPy, pandas and scikit-learn do the heavy work in C, which releases the GIL, so ML code is mostly unaffected.`,
   a:R`<ul><li><b>I/O-bound</b> work (web calls, file reads): threads or <code>asyncio</code> work well, because the GIL is released while waiting.</li>
<li><b>CPU-bound pure Python</b>: use <code>multiprocessing</code> (separate processes, each with its own GIL) or vectorise with NumPy.</li>
<li>scikit-learn's <code>n_jobs=-1</code> runs in parallel using processes or C-level threads.</li>
<li>Python 3.13 added an experimental free-threaded build without the GIL.</li></ul>`},
  {id:"i1-decorator", day:1, level:"adv", q:"What is a decorator? Give an example.",
   say:R`A decorator is a function that takes a function and returns a new function that wraps it, adding behaviour like timing, logging, caching or access checks without changing the original code.`,
   a:R`<pre><code>import time, functools
def timed(fn):
    @functools.wraps(fn)                  # keep the original name and docstring
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = fn(*args, **kwargs)
        print(f"{fn.__name__} took {time.perf_counter() - start:.3f}s")
        return result
    return wrapper

@timed
def train(): ...</code></pre>
<p>You've used them already: <code>@property</code>, <code>@dataclass</code>, <code>@functools.lru_cache</code>, and FastAPI's <code>@app.get("/api/status")</code>, which is like an attribute route in ASP.NET.</p>`},
  {id:"i1-duck", day:1, level:"adv", q:"What is duck typing? How does scikit-learn use it?",
   say:R`"If it walks like a duck…": Python cares whether an object has the methods you call, not what class it is. scikit-learn relies on this: anything with fit and transform can go in a Pipeline.`,
   a:R`<p>Every estimator follows the same interface: <code>fit(X, y)</code>, <code>predict(X)</code>, <code>transform(X)</code>, <code>get_params()</code>. That's why you can swap <code>MultinomialNB()</code> for <code>LogisticRegression()</code> without changing the rest of the code, and why <code>GridSearchCV</code> works on any model. In C# you'd define an interface; in Python the shared methods are the contract.</p>`},

  // ===================== Day 2: NumPy, Pandas, EDA =====================
  {id:"i2-numpyfast", day:2, level:"basic", q:"Why is NumPy faster than Python lists?",
   say:R`NumPy stores numbers of one type in a contiguous block of memory and runs operations in compiled C over the whole array at once (vectorisation). A list holds pointers to separate Python objects, and each operation goes through the interpreter.`,
   a:R`<p>Three reasons: <b>no per-element type checks</b> (one dtype), <b>cache-friendly contiguous memory</b>, and <b>loops in C or SIMD instructions</b> instead of Python bytecode. Typical speed-up is 10–100×. It also uses less memory: a float64 is 8 bytes in NumPy versus about 24 bytes as a Python float object, plus an 8-byte pointer in the list.</p>`},
  {id:"i2-lociloc", day:2, level:"basic", q:"loc vs iloc?",
   say:R`loc selects by label (index values and column names) and also takes boolean conditions; iloc selects by integer position. loc slices include the end, iloc slices don't.`,
   a:R`<pre><code>df.loc[5, "age"]          # the row whose index LABEL is 5
df.iloc[5, 2]             # the 6th row, 3rd column
df.loc[df.age &lt; 12, ["name", "survived"]]
df.loc[0:3]   # 4 rows (labels 0, 1, 2, 3)   df.iloc[0:3]   # 3 rows</code></pre>
<p>After filtering or sorting, labels and positions no longer match, which is when mixing them up causes bugs.</p>`},
  {id:"i2-eda", day:2, level:"basic", q:"What is EDA and how do you approach a new dataset?",
   say:R`Exploratory Data Analysis is understanding the data before modelling: its structure, quality, the target, and the relationships. I follow a fixed order: inspect, missing values, target, one variable at a time, pairs, then features.`,
   a:R`<ol><li>Shape, types, <code>head</code>, <code>info</code>, <code>describe</code>.</li>
<li>Missing values and duplicates; impossible values.</li>
<li>Target distribution → baseline and class imbalance.</li>
<li>Univariate: histograms for numbers, counts for categories, skew and outliers.</li>
<li>Bivariate: each feature against the target (rates by group, box plots).</li>
<li>Multivariate: pivots and correlations.</li>
<li>Check for leakage, then engineer features.</li></ol>
<p>On Titanic this showed a 38% survival rate, sex and class as the strongest signals, 77% missing deck, skewed fares, and a leaking <code>alive</code> column.</p>`},
  {id:"i2-std", day:2, level:"basic", q:"Population vs sample standard deviation: why n − 1?",
   say:R`With a sample, I measure distances from the sample mean, which is always closer to the data than the true mean, so the spread comes out too small. Dividing by n − 1 (Bessel's correction) fixes that bias.`,
   a:R`<p>Practical trap: <code>np.std(x)</code> defaults to <code>ddof=0</code> (divide by n), while pandas <code>Series.std()</code> defaults to <code>ddof=1</code> (n − 1). For 2, 4, 4, 4, 5, 5, 7, 9 you get 2.0 vs 2.138. With large n the difference is negligible.</p>`},
  {id:"i2-axis", day:2, level:"mid", q:"Explain axis=0 vs axis=1.",
   say:R`The axis you name is the one that gets collapsed. axis=0 works down the rows and gives one result per column; axis=1 works across the columns and gives one result per row.`,
   a:R`<pre><code>m.shape            # (3 students, 2 subjects)
m.mean(axis=0)     # shape (2,): average per subject
m.mean(axis=1)     # shape (3,): average per student
df.drop("age", axis=1)   # removes a column</code></pre>`},
  {id:"i2-broadcast", day:2, level:"mid", q:"What is broadcasting? What are the rules?",
   say:R`Broadcasting lets NumPy do arithmetic on arrays of different shapes by virtually stretching dimensions of size 1. Shapes are compared from the right; each pair must be equal or one of them must be 1.`,
   a:R`<pre><code>X.shape = (1000, 5); mu.shape = (5,)  → X - mu works (row subtracted from every row)
(1000, 5) and (1000,)  → error; reshape to (1000, 1) first: v[:, None]</code></pre>
<p>No data is copied, so it's fast and memory-efficient. Standardising a feature matrix in one line, <code>(X - X.mean(0)) / X.std(0)</code>, relies on it.</p>`},
  {id:"i2-missing", day:2, level:"mid", q:"How do you handle missing values?",
   say:R`First I find out why they're missing and how many. Then per column: drop it if mostly missing, impute by median or group median for numbers or the mode for categories, add a "was missing" flag when missingness might be informative, and fit any imputation on training data only.`,
   a:R`<ul><li><b>MCAR</b> (missing completely at random) → simple imputation is fine.</li>
<li><b>MAR</b> (depends on other columns, e.g. age missing more in 3rd class) → impute using those columns (group median, KNN or iterative imputer).</li>
<li><b>MNAR</b> (depends on the missing value itself, e.g. high earners hiding income) → the flag is essential; imputation alone biases results.</li></ul>
<p>Use the median over the mean for skewed data. Tree models like LightGBM can handle NaN natively. Use <code>SimpleImputer</code> inside a <code>Pipeline</code> so it's fitted only on training folds.</p>`},
  {id:"i2-merge", day:2, level:"mid", q:"merge vs join vs concat in pandas?",
   say:R`merge is a SQL-style join on columns; join is a shortcut that joins on the index; concat stacks DataFrames vertically (like UNION ALL) or side by side.`,
   a:R`<pre><code>orders.merge(customers, on="customer_id", how="left")
df1.join(df2)                 # on the index
pd.concat([jan, feb])         # more rows
pd.concat([X, dummies], axis=1)   # more columns</code></pre>
<p>Always check row counts after a merge: duplicate keys on the right side multiply rows. <code>validate="many_to_one"</code> catches that.</p>`},
  {id:"i2-aggtrans", day:2, level:"mid", q:"groupby().agg() vs groupby().transform()?",
   say:R`agg returns one row per group, a summary; transform returns a result the same length as the original data, so I can add it back as a column.`,
   a:R`<pre><code>df.groupby("pclass")["fare"].agg(["mean", "count"])          # 3 rows
df["class_avg_fare"] = df.groupby("pclass")["fare"].transform("mean")   # 891 rows
df["fare_vs_class"] = df.fare / df.class_avg_fare</code></pre>
<p>transform is how you do group-wise imputation and "compared to my group" features.</p>`},
  {id:"i2-outlier", day:2, level:"mid", q:"How do you detect and treat outliers?",
   say:R`Detect with box plots or the IQR rule for skewed data, and z-scores for roughly normal data. Then decide based on cause: fix or remove errors, but keep genuine extremes, perhaps capped or log-transformed.`,
   a:R`<ul><li>IQR rule: outside Q1 − 1.5·IQR to Q3 + 1.5·IQR.</li>
<li>z-score: |z| &gt; 3. It's weak on skewed data because outliers inflate σ itself.</li>
<li>Treatments: correct data-entry errors; cap (winsorize); log-transform; use robust models (trees) or losses (Huber).</li>
<li>Never remove outliers blindly. In fraud detection, the outliers are the target.</li></ul>`},
  {id:"i2-leak", day:2, level:"adv", q:"What is data leakage? Give examples.",
   say:R`Leakage is when training uses information that wouldn't be available at prediction time, so validation scores look great but the model fails in production.`,
   a:R`<ul><li><b>Target leakage</b>: a feature that encodes the answer. Titanic's <code>alive</code> column; "refund_issued" when predicting fraud.</li>
<li><b>Train–test contamination</b>: scaling, imputing or fitting a vocabulary on the full dataset before splitting. TextPulse fits its TF-IDF vocabulary on training data only for this reason.</li>
<li><b>Time leakage</b>: random splits on time-series data, so the model "sees the future". Split by date instead.</li>
<li><b>Duplicate leakage</b>: the same customer in both train and test. Use GroupKFold.</li></ul>
<p>Red flag: a suspiciously high score. Fix: put all preprocessing in a Pipeline, and ask "would I know this at prediction time?" for every feature.</p>`},
  {id:"i2-corr", day:2, level:"adv", q:"Correlation vs causation; Pearson vs Spearman?",
   say:R`Correlation only means two variables move together; causation needs a mechanism or a controlled experiment, because a third variable can drive both. Pearson measures linear relationships; Spearman ranks the data first, so it captures any monotonic relationship and is robust to outliers.`,
   a:R`<p>Example: ice-cream sales and drownings correlate because summer drives both. On Titanic, fare and survival correlate, but class drives both.</p>
<p>Pearson r = 0 doesn't mean "no relationship": y = x² has r = 0. Neither works for categorical variables; use group rates, chi-square or Cramér's V for those.</p>`},
  {id:"i2-perf", day:2, level:"adv", q:"Your pandas code is slow on 10 million rows. What do you do?",
   say:R`Replace apply and row loops with vectorised operations, shrink dtypes, load only the columns I need, and process in chunks or move to a faster engine if it still doesn't fit.`,
   a:R`<ul><li>Vectorise: <code>np.where</code>, arithmetic on columns, <code>.str</code> and <code>.dt</code> accessors instead of <code>.apply(lambda ...)</code>.</li>
<li>Memory: <code>category</code> for repeated strings, <code>float32</code>/<code>int32</code> where precision allows, <code>usecols=</code> in <code>read_csv</code>.</li>
<li>Chunks: <code>pd.read_csv(..., chunksize=500_000)</code>.</li>
<li>Formats: Parquet instead of CSV (columnar, compressed, typed).</li>
<li>Engines: Polars or DuckDB for single-machine speed; Spark for clusters.</li></ul>`},

  // ===================== Day 3: Probability =====================
  {id:"i3-cond", day:3, level:"basic", q:"What is conditional probability? Give a data example.",
   say:R`P(A | B) is the probability of A once we know B happened: P(A and B) divided by P(B). In data, it's just filtering to the rows where B is true and measuring A.`,
   a:R`<p>Titanic: P(survived) = 0.38, but P(survived | female) = 233/314 = 0.74. In pandas, <code>df[df.sex == "female"].survived.mean()</code>. Every groupby-mean is a table of conditional probabilities.</p>`},
  {id:"i3-indep", day:3, level:"basic", q:"Independent vs mutually exclusive events?",
   say:R`Independent means one event doesn't change the other's probability, so P(A and B) = P(A)·P(B). Mutually exclusive means they can't both happen, so P(A and B) = 0. Mutually exclusive events with non-zero probabilities are actually dependent.`,
   a:R`<p>Two separate coin flips are independent. "Rolled a 1" and "rolled a 6" on one roll are mutually exclusive: knowing one happened tells you the other didn't, which is the opposite of independence.</p>`},
  {id:"i3-normal", day:3, level:"basic", q:"Describe the normal distribution and the 68–95–99.7 rule.",
   say:R`A symmetric bell curve described by its mean and standard deviation. About 68% of values fall within one σ of the mean, 95% within two, and 99.7% within three.`,
   a:R`<p>It appears whenever many small independent effects add up, and averages of large samples are approximately normal by the Central Limit Theorem. Uses: z-scores, confidence intervals (±1.96σ for 95%), and the assumptions behind linear regression residuals and t-tests. Real data with heavy tails, like financial returns, isn't normal, so check with a histogram or Q-Q plot.</p>`},
  {id:"i3-bayes", day:3, level:"mid", q:"Explain Bayes' theorem with an example.",
   say:R`Bayes updates a prior belief with evidence: posterior = likelihood × prior ÷ evidence. Classic example: a 99%-sensitive test with 5% false positives for a disease 1% of people have. A positive result means only about a 17% chance of having the disease.`,
   a:R`<p>Out of 10,000 people, 100 are sick and 99 of them test positive; 9,900 are healthy and 495 test positive (5%). So 99 of 594 positives are sick: <b>16.7%</b>.</p>
<p>Why it matters in ML: it's the basis of Naive Bayes, and it explains why rare-class problems (fraud, disease) have low precision even with good models. Always state the base rate.</p>`},
  {id:"i3-pdf", day:3, level:"mid", q:"PMF vs PDF vs CDF?",
   say:R`A PMF gives actual probabilities for discrete values. A PDF gives density for continuous values; probabilities are areas under it, and any single point has probability zero. The CDF gives P(X ≤ x) for either kind and is the easiest way to get range probabilities.`,
   a:R`<p>A PDF can exceed 1 (density, not probability). P(a &lt; X ≤ b) = F(b) − F(a). In scipy: <code>.pmf / .pdf</code>, <code>.cdf</code>, <code>.sf</code> (= 1 − cdf) and <code>.ppf</code> (inverse CDF, for percentiles).</p>`},
  {id:"i3-binpois", day:3, level:"mid", q:"Binomial vs Poisson: when do you use each?",
   say:R`Binomial counts successes in a fixed number n of independent trials with the same probability p. Poisson counts events in a time or space interval with no fixed maximum, given an average rate λ.`,
   a:R`<p>Binomial: 7 conversions out of 200 visitors. Poisson: 3 server errors per hour. For large n and small p, Binomial(n, p) ≈ Poisson(np). A Poisson's mean equals its variance; if real counts have a much larger variance (overdispersion), use a negative binomial model instead.</p>`},
  {id:"i3-naive", day:3, level:"mid", q:"Why is Naive Bayes called naive, and why does it still work?",
   say:R`It assumes features are independent given the class, which is almost never true for words. It still works because classification only needs the right class to have the highest score, not accurate probabilities, and the errors from the assumption often affect all classes similarly.`,
   a:R`<p>Strengths: trains in one pass, handles huge vocabularies, needs little data, and is a strong text baseline. Weaknesses: correlated features are double-counted, so probabilities are overconfident (poorly calibrated), and it's usually beaten by logistic regression with enough data. That matches TextPulse: NB 80.3% vs LR 82.3% on sentiment.</p>`},
  {id:"i3-laplace", day:3, level:"mid", q:"What is Laplace smoothing and why is it needed?",
   say:R`It adds a small count (1, or alpha) to every word in every class, so a word never seen with a class gets a small probability instead of zero. Without it, one unseen word makes the whole product zero.`,
   a:R`<p>Formula: (count + α) / (total + α·|V|). In scikit-learn it's <code>MultinomialNB(alpha=...)</code>, tuned like any hyperparameter: TextPulse used 0.1. Larger α means stronger smoothing, pulling probabilities toward uniform.</p>`},
  {id:"i3-log", day:3, level:"mid", q:"Why do we work with log probabilities?",
   say:R`Multiplying hundreds of small probabilities underflows to 0.0 in floating point. Taking logs turns the product into a sum of manageable negative numbers, and because log is increasing, the class with the highest log score is still the winner.`,
   a:R`<p>(10⁻⁵)¹⁰⁰ is 0.0 in float64, but its log is −1151.3. Logs also turn products into sums, which makes optimisation easier: maximising log-likelihood is how logistic regression and neural networks are trained.</p>`},
  {id:"i3-baserate", day:3, level:"adv", q:"A fraud model has 99% recall and a 1% false-positive rate. Fraud is 0.1% of transactions. Is it good?",
   say:R`Apply Bayes. Per million transactions: 1,000 frauds, of which 990 are caught; 999,000 legitimate, of which 9,990 are flagged. Precision is 990 / 10,980 ≈ 9%, so about 10 false alarms per real fraud. Whether that's acceptable depends on the cost of reviewing an alert versus the cost of a missed fraud.`,
   a:R`<p>This tests whether you think in base rates. Ways to improve it: raise the threshold (fewer alerts, lower recall), add a second-stage model for flagged cases, or report precision–recall curves and PR-AUC instead of accuracy (which here would be about 99%, and meaningless).</p>`},
  {id:"i3-expect", day:3, level:"adv", q:"On average, how many rolls of a fair die does it take to get a six?",
   say:R`6. The number of trials until the first success is geometric, with mean 1/p, and here p = 1/6.`,
   a:R`<p>Derivation: let E be the expected number. Roll once; with probability 1/6 you're done, otherwise you're back where you started: E = 1 + (5/6)E → E = 6. The "condition on the first step" trick solves many interview puzzles.</p>`},
  {id:"i3-montyhall", day:3, level:"adv", q:"Monty Hall: three doors, one car. You pick a door, the host opens another with a goat. Should you switch?",
   say:R`Yes. Switching wins with probability 2/3. Your first pick is right 1/3 of the time; the host's choice isn't random, because he always reveals a goat, so the remaining 2/3 moves to the other closed door.`,
   a:R`<p>Check by listing cases: if your first pick is the car (1/3), switching loses; if it's a goat (2/3), the host must reveal the other goat, and switching wins. You can confirm with a 10-line simulation, which is also a good answer to give.</p>`},
  {id:"i3-birthday", day:3, level:"adv", q:"How many people do you need for a 50% chance that two share a birthday?",
   say:R`23. Use the complement: P(all different) = 365/365 × 364/365 × … × 343/365 ≈ 0.493, so P(at least one shared) ≈ 0.507.`,
   a:R`<p>It's surprisingly low because there are 23 × 22 / 2 = 253 pairs of people. The same idea explains hash collisions, and why random IDs need many bits.</p>`},
];

INTERVIEW.push(
  // ===================== Project: TextPulse =====================
  {id:"ip-walk", day:"P", level:"basic", q:"Walk me through your TextPulse project.",
   say:R`TextPulse is a real-time text classification system. I trained a spam detector on 35,000 emails and SMS and a sentiment model on 1.6 million tweets, using TF-IDF features with Naive Bayes and Logistic Regression. Logistic Regression won: 97.95% and 82.3% accuracy on held-out data. A FastAPI server streams unseen test messages through the models over a WebSocket to a live dashboard that shows each prediction, the words behind it, and running accuracy. It's deployed for free on Hugging Face with GitHub Actions CI/CD.`,
   a:R`<p>Structure it as <b>problem → data → approach → results → engineering → what I'd improve</b>, in about two minutes:</p>
<ol><li><b>Problem</b>: show end-to-end ML: from raw public data to a live, explainable product.</li>
<li><b>Data</b>: Sentiment140, SMS Spam Collection, Enron-Spam: 1.64M records in total.</li>
<li><b>Approach</b>: text cleaning, TF-IDF with word pairs, two algorithms compared, stratified split, test set never touched during fitting.</li>
<li><b>Results</b>: spam 97.95% accuracy (precision 98.1%, recall 97.1%); sentiment 82.3%; about 38,500 messages per second in bulk.</li>
<li><b>Engineering</b>: FastAPI, WebSockets, async streaming, pytest, CI/CD, and a browser engine for free hosting.</li>
<li><b>Next</b>: a transformer model for sentiment, drift monitoring, and newer spam data.</li></ol>`},
  {id:"ip-tfidf", day:"P", level:"basic", q:"What is TF-IDF and why did you use it?",
   say:R`TF-IDF turns text into numbers: a word scores high if it's frequent in this message but rare across all messages. I used it because it's fast, works very well with linear models for text classification, and keeps predictions explainable word by word.`,
   a:R`<p>TF = 1 + ln(count) (sublinear), IDF = ln((1 + N)/(1 + df)) + 1, then each vector is scaled to length 1. Word pairs (bigrams) capture phrases like "not good" and "click here". <code>min_df=3</code> drops rare noise. Compared with plain counts, IDF down-weights words that appear everywhere ("the", "is").</p>`},
  {id:"ip-lrnb", day:"P", level:"mid", q:"Why did Logistic Regression beat Naive Bayes?",
   say:R`Naive Bayes assumes words are independent, so correlated words like "click" and "here" get counted twice. Logistic Regression learns all the weights together, so it accounts for overlap. With plenty of data, the discriminative model usually wins: 82.3% vs 80.3% on sentiment, and 97.95% vs 97.52% on spam.`,
   a:R`<p>Trade-offs to mention: NB trained in 3 seconds vs 58 seconds for LR on 1.28M tweets, and NB had slightly higher spam recall (97.5% vs 97.1%) but lower precision. I chose by accuracy and F1 on the held-out set, chosen in advance. The model selection was automatic in the training script.</p>`},
  {id:"ip-eval", day:"P", level:"mid", q:"How do you know 97.95% is real and not overfitting or leakage?",
   say:R`The test set was split off first with a stratified split and never used for fitting anything, including the TF-IDF vocabulary. The dashboard replays only those held-out messages and checks every prediction against the true label live. I also broke accuracy down by source: email 98.4%, SMS 95.1%.`,
   a:R`<ul><li>Regularisation (C = 4) and <code>min_df=3</code> limit overfitting to rare words.</li>
<li>The train vs test gap is small.</li>
<li>Spam data is fairly balanced (43% spam), so accuracy is meaningful, but I also report precision, recall and the confusion matrix.</li>
<li>Honest caveat: the data is old (Enron 1999–2005), so accuracy on today's phishing would be lower. A fresh, time-based test set would be the next check.</li></ul>`},
  {id:"ip-explain", day:"P", level:"mid", q:"How does your model explain its predictions?",
   say:R`Both models are linear, so the score is the sum of each word's TF-IDF value times its learned weight, plus a bias. I show the words with the biggest contributions toward the predicted label. That's an exact explanation, not an approximation like SHAP or LIME.`,
   a:R`<p>Example: the phishing sample "URGENT: your account has been suspended…" scores spam at 87%, driven by "your" (+0.95), "account", "url" and "urgent". Explanations like this also reveal weaknesses: "your" being the top spam word shows the model learned style patterns from old emails.</p>`},
  {id:"ip-realtime", day:"P", level:"mid", q:"How does the real-time part work?",
   say:R`FastAPI starts an async background task that takes the next unseen message, classifies it in well under a millisecond, updates the counters, and pushes the result to every connected dashboard over a WebSocket. The browser batches updates and redraws once per animation frame, so it stays smooth at 200 messages per second.`,
   a:R`<p>Why a WebSocket and not polling: the server pushes as soon as there's data, with one connection instead of hundreds of requests. Why async: one process can serve many dashboards while the stream loop runs. New visitors get the last 60 seconds of chart history from <code>/api/status</code>, so charts aren't empty after a refresh.</p>`},
  {id:"ip-deploy", day:"P", level:"mid", q:"How is it deployed? What happens when you push code?",
   say:R`GitHub Actions builds the site and uploads it to a Hugging Face static Space whenever the dashboard or model files change, and a daily workflow checks that the site is up. Because server Spaces now need a paid plan, I exported the models to JSON and run the same maths in the browser, after verifying it gives identical results to scikit-learn.`,
   a:R`<p>Details: the Hugging Face token is stored as an encrypted GitHub secret; files are gzipped (17 MB → 5 MB) and decompressed in the browser with <code>DecompressionStream</code>; and the verification step refuses to export if fewer than 99.9% of labels match (the actual result was 100% on 6,000 messages). Locally, the same dashboard talks to the FastAPI server, because a small <code>api</code> layer in app.js picks the backend.</p>`},
  {id:"ip-scale", day:"P", level:"adv", q:"How would you scale this to millions of messages per second in production?",
   say:R`Put messages on a queue like Kafka, run many stateless prediction workers that consume and score in batches, scale them horizontally, write results to a store, and serve the dashboard from aggregated metrics rather than individual events.`,
   a:R`<ul><li>Batching: vectorising 1,000 messages at once is far faster than one at a time (bulk scoring already reached about 38,500/s on one CPU).</li>
<li>Stateless workers in containers behind autoscaling (Kubernetes, Azure Container Apps).</li>
<li>Model loaded once per worker; versioned in a model registry.</li>
<li>Pre-aggregate metrics per second; WebSocket fan-out through Redis pub/sub.</li>
<li>Monitoring: latency, throughput, prediction distribution and data drift.</li></ul>`},
  {id:"ip-improve", day:"P", level:"adv", q:"What are the limitations and what would you improve?",
   say:R`The data is old and the sentiment labels come from emoticons, so they're noisy. Bag-of-words can't understand sarcasm or word order beyond pairs. I'd add a fine-tuned transformer like DistilBERT for sentiment, collect recent phishing data, tune the decision threshold to the cost of errors, and add drift monitoring with periodic retraining.`,
   a:R`<ul><li>Hyperparameter search (C, n-gram range, min_df) with cross-validation on the training data.</li>
<li>Calibrate probabilities (<code>CalibratedClassifierCV</code>) if downstream decisions use the scores.</li>
<li>Separate spam models per channel (SMS accuracy is lower: 95.1%).</li>
<li>Human feedback loop: let users correct predictions and use those as new training data.</li></ul>`},
  {id:"ip-imbalance", day:"P", level:"adv", q:"What would change if spam were only 1% of messages?",
   say:R`Accuracy would become misleading, since predicting "ham" always would score 99%. I'd focus on precision, recall and PR-AUC, use class weights or resampling during training, and choose the decision threshold based on the business cost of false alarms versus missed spam.`,
   a:R`<p>Same base-rate logic as Bayes on Day 3: with rare positives, even a small false-positive rate creates many false alarms. Options: <code>LogisticRegression(class_weight="balanced")</code>, threshold tuning on a validation set, and stratified cross-validation so every fold contains positives.</p>`},
);


// ---------- state (per-viewer conveniences only) ----------
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let done = new Set(load("ml-sticky-done", []));
let ready = new Set(load("ml-interview-ready", []));
let view = (location.hash.slice(1) in SUBS) ? location.hash.slice(1) : load("ml-view", "sticky");
let activeDay = "all", activeType = "all", activeLevel = "all", query = "", hideDone = false, hideReady = false;
const tilts = [-1.4, .9, -.6, 1.3, -1, .5, 1.1, -.8];
const $ = id => document.getElementById(id);
const dayColor = d => `var(--d${d})`;
const dayLabel = d => d === "P" ? "Project" : `Day ${d}`;
const textOf = html => html.replace(/<[^>]+>/g, " ");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

function chip(container, value, label, isActive, onClick, color){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.setAttribute("aria-pressed", isActive ? "true" : "false");
  b.innerHTML = (color ? `<span class="dot" style="background:${color}"></span>` : "") + label;
  b.addEventListener("click", () => onClick(value));
  container.appendChild(b);
}
function renderChips(){
  const dc = $("dayChips"); dc.innerHTML = "";
  chip(dc, "all", "All", activeDay === "all", v => { activeDay = v; render(); });
  Object.entries(DAYS).forEach(([d, l]) => chip(dc, d, l, activeDay === d, v => { activeDay = v; render(); }, dayColor(d)));
  const tc = $("typeChips"); tc.innerHTML = "";
  chip(tc, "all", "All types", activeType === "all", v => { activeType = v; render(); });
  Object.entries(TYPES).forEach(([t, o]) => chip(tc, t, o.label, activeType === t, v => { activeType = v; render(); }, `var(--n-${t})`));
  const lc = $("levelChips"); lc.innerHTML = "";
  chip(lc, "all", "All levels", activeLevel === "all", v => { activeLevel = v; render(); });
  Object.entries(LEVELS).forEach(([k, l]) => chip(lc, k, l, activeLevel === k, v => { activeLevel = v; render(); }, `var(--lv-${k})`));
}
const matches = (item, fields) => {
  const q = query.trim().toLowerCase();
  return (activeDay === "all" || String(item.day) === activeDay) && (!q || textOf(fields.join(" ")).toLowerCase().includes(q));
};
function groupByDay(list, build){
  const out = document.createDocumentFragment();
  Object.keys(DAYS).forEach(d => {
    const items = list.filter(i => String(i.day) === d);
    if (!items.length) return;
    const h = document.createElement("div");
    h.className = "day-head";
    h.innerHTML = `<span class="bar" style="background:${dayColor(d)}"></span><h2>${dayLabel(d)}: ${DAY_TITLES[d]}</h2><span>${items.length}</span>`;
    out.appendChild(h);
    out.appendChild(build(items));
  });
  return out;
}
function typeset(el){
  if (window.katex) {
    el.querySelectorAll("[data-tex]").forEach(t => { try { katex.render(t.dataset.tex, t, {displayMode:true, throwOnError:false}); } catch(e){} });
  }
  if (window.renderMathInElement) {
    renderMathInElement(el, {delimiters:[{left:"\\[", right:"\\]", display:true}, {left:"\\(", right:"\\)", display:false}], throwOnError:false});
  }
}

// ---------- views ----------
function renderSticky(out){
  const list = NOTES.filter(n => matches(n, [n.title, n.body]) && (activeType === "all" || n.type === activeType) && (!hideDone || !done.has(n.id)));
  const board = document.createElement("div"); board.className = "board";
  list.forEach((n, i) => {
    const el = document.createElement("article");
    el.className = `note ${n.type}` + (done.has(n.id) ? " done" : "");
    el.style.setProperty("--tilt", tilts[i % tilts.length] + "deg");
    el.innerHTML = `<div class="tag"><span>${dayLabel(n.day)} · ${TYPES[n.type].label}</span></div>
      <h3>${n.title}</h3>${n.body}
      <button class="got" type="button" aria-pressed="${done.has(n.id)}">${done.has(n.id) ? "Got it ✓" : "Got it"}</button>`;
    el.querySelector(".got").addEventListener("click", () => { done.has(n.id) ? done.delete(n.id) : done.add(n.id); save("ml-sticky-done", [...done]); render(); });
    board.appendChild(el);
  });
  out.appendChild(list.length ? board : empty());
  return `<b>${NOTES.filter(n => done.has(n.id)).length}</b> / ${NOTES.length} notes learned`;
}
function renderFormulas(out){
  const list = FORMULAS.filter(f => matches(f, [f.name, f.tex, f.example, f.use, (f.symbols||[]).flat().join(" ")]));
  out.appendChild(list.length ? groupByDay(list, items => {
    const g = document.createElement("div"); g.className = "fgrid";
    items.forEach(f => {
      const c = document.createElement("article");
      c.className = "fcard rich"; c.style.setProperty("--dc", dayColor(f.day));
      c.innerHTML = `<div class="tag" style="color:var(--muted)">${dayLabel(f.day)}</div><h3>${f.name}</h3>
        <div class="tex" data-tex="${esc(f.tex)}"><span class="tex-fallback">${esc(f.tex)}</span></div>
        ${f.symbols ? `<div class="lbl">What each symbol means</div><table class="sym">${f.symbols.map(([s, m]) => `<tr><td>\\(${s}\\)</td><td>${m}</td></tr>`).join("")}</table>` : ""}
        <div class="lbl">Worked example</div><div class="ex">${f.example}</div>
        <div class="lbl">Use it when</div><div class="ex">${f.use}</div>`;
      g.appendChild(c);
    });
    return g;
  }) : empty());
  return `<b>${FORMULAS.length}</b> formulas`;
}
function cardList(items, build){
  const wrap = document.createElement("div");
  items.forEach(i => wrap.appendChild(build(i)));
  return wrap;
}
function renderLessons(out){
  const list = LESSONS.filter(l => matches(l, [l.title, l.body]));
  out.appendChild(list.length ? groupByDay(list, items => cardList(items, l => {
    const d = document.createElement("details"); d.className = "card"; d.id = l.id;
    d.style.setProperty("--dc", dayColor(l.day));
    d.innerHTML = `<summary><span class="q">${l.title}</span></summary><div class="body rich">${l.body}</div>`;
    return d;
  })) : empty());
  return `<b>${LESSONS.length}</b> topics`;
}
function renderInterview(out){
  const list = INTERVIEW.filter(q => matches(q, [q.q, q.say, q.a]) && (activeLevel === "all" || q.level === activeLevel) && (!hideReady || !ready.has(q.id)));
  out.appendChild(list.length ? groupByDay(list, items => cardList(items, q => {
    const d = document.createElement("details");
    d.className = "card qa" + (ready.has(q.id) ? " is-ready" : ""); d.id = q.id;
    d.style.setProperty("--dc", dayColor(q.day));
    d.innerHTML = `<summary><span class="lvl ${q.level}">${LEVELS[q.level]}</span><span class="q">${q.q}</span>${ready.has(q.id) ? '<span class="ready">ready ✓</span>' : ""}</summary>
      <div class="body rich"><div class="say"><b>Say this first</b>${q.say}</div>${q.a}
      <div class="qa-foot"><button class="got" type="button" aria-pressed="${ready.has(q.id)}">${ready.has(q.id) ? "I can answer this ✓" : "I can answer this"}</button></div></div>`;
    d.querySelector(".got").addEventListener("click", () => { ready.has(q.id) ? ready.delete(q.id) : ready.add(q.id); save("ml-interview-ready", [...ready]); render(); });
    return d;
  })) : empty());
  return `<b>${INTERVIEW.filter(q => ready.has(q.id)).length}</b> / ${INTERVIEW.length} questions ready`;
}
function empty(){ const p = document.createElement("p"); p.className = "empty"; p.textContent = "Nothing matches. Clear the search or pick another filter."; return p; }

function render(){
  const openIds = [...document.querySelectorAll("details.card[open]")].map(d => d.id);
  renderChips();
  document.querySelectorAll(".view").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  document.querySelectorAll("[data-for]").forEach(el => el.hidden = !el.dataset.for.split(" ").includes(view));
  $("sub").textContent = SUBS[view];
  $("c-sticky").textContent = NOTES.length; $("c-formulas").textContent = FORMULAS.length;
  $("c-lessons").textContent = LESSONS.length; $("c-interview").textContent = INTERVIEW.length;
  const out = $("out"); out.innerHTML = "";
  const progress = {sticky:renderSticky, formulas:renderFormulas, lessons:renderLessons, interview:renderInterview}[view](out);
  $("progress").innerHTML = progress;
  openIds.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  typeset(out);
}
document.querySelectorAll(".view").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view; save("ml-view", view);
  try { history.replaceState(null, "", "#" + view); } catch(e){}
  render(); window.scrollTo({top:0});
}));
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("hideDone").addEventListener("change", e => { hideDone = e.target.checked; render(); });
$("hideReady").addEventListener("change", e => { hideReady = e.target.checked; render(); });
$("expandAll").addEventListener("click", () => document.querySelectorAll("#out details.card").forEach(d => d.open = true));
$("collapseAll").addEventListener("click", () => document.querySelectorAll("#out details.card").forEach(d => d.open = false));
$("randomQ").addEventListener("click", () => {
  const all = [...document.querySelectorAll("#out details.qa")];
  if (!all.length) return;
  all.forEach(d => d.open = false);
  const pick = all[Math.floor(Math.random() * all.length)];
  pick.scrollIntoView({behavior:"smooth", block:"center"});
  pick.classList.remove("flash"); void pick.offsetWidth; pick.classList.add("flash");
});
render();
// KaTeX loads with "defer"; typeset again once it's ready
window.addEventListener("load", () => typeset($("out")));
</script>
